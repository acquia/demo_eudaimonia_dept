machineName: uswds_collection_item
name: '(Eud-Kit) USWDS Collection Item'
required:
  - title
props:
  title:
    type: string
    title: Title
    examples:
      - 'Article title goes here'
  link:
    type: string
    format: uri-reference
    title: Link
    examples:
      - /articles/example
  description:
    type: string
    contentMediaType: text/html
    x-formatting-context: block
    title: Description
    examples:
      - '<p>A short description or excerpt for this collection item.</p>'
  categoryLabel:
    type: string
    title: 'Category label'
    examples:
      - Health
  calendarMonthShort:
    type: string
    title: 'Calendar month (short)'
    examples:
      - Apr
  calendarDay:
    type: string
    title: 'Calendar day'
    examples:
      - '28'
slots:
  meta:
    title: Meta
  topics:
    title: Topics
js:
  original: |
    import { cn, FormattedText } from 'drupal-canvas';

    const UswdsCollectionItem = ({
      title = '',
      link = '',
      description = '',
      spacing = 'default',
      calendarMonthShort = '',
      calendarDay = '',
      categoryLabel = '',
      meta,
      topics,
      className = '',
    }) => {
      const hasCalendar = calendarMonthShort || calendarDay;
      const hasLeft = hasCalendar || categoryLabel;

      return (
        <li
          className={cn(
            'usa-collection__item flex gap-4 border-t border-(--color-uswds-base-lighter) font-sans',
            spacing === 'condensed' ? 'py-2' : 'py-4',
            className,
          )}
        >
          {/* Left column — category tag OR calendar date block */}
          {hasLeft && (
            <div className="flex w-[100px] shrink-0 flex-col items-start pt-[3px]">
              {categoryLabel && (
                <span className="inline-block rounded-sm bg-(--color-uswds-primary-lightest) px-2 py-1 text-[11px] font-bold tracking-[0.6px] text-(--color-uswds-primary-darker) uppercase">
                  {categoryLabel}
                </span>
              )}
              {hasCalendar && (
                <div className="flex w-[52px] flex-col items-center overflow-hidden rounded-sm border border-(--color-uswds-primary-light) text-(--color-uswds-primary-darker)">
                  <div className="w-full bg-(--color-uswds-primary-lightest) py-0.5 text-center text-[10px] font-bold tracking-wider uppercase">
                    {calendarMonthShort}
                  </div>
                  <div className="py-1.5 text-2xl leading-none font-black">
                    {calendarDay}
                  </div>
                </div>
              )}
            </div>
          )}

          {/* Content */}
          <div className="flex flex-1 flex-col gap-2">
            {title &&
              (link ? (
                <a
                  href={link}
                  className="text-[16px] leading-[1.3] font-bold text-(--color-uswds-primary) underline hover:text-(--color-uswds-primary-dark) hover:no-underline active:text-(--color-uswds-primary-darker)"
                >
                  {title}
                </a>
              ) : (
                <span className="text-[16px] leading-[1.3] font-bold text-(--color-uswds-primary)">
                  {title}
                </span>
              ))}
            {description && (
              <div className="text-base leading-[1.5] text-(--color-uswds-base-ink)">
                <FormattedText>{description}</FormattedText>
              </div>
            )}
            {meta && (
              <div className="flex flex-row flex-wrap items-center gap-2">
                {meta}
              </div>
            )}
            {topics && <div className="flex flex-wrap gap-1">{topics}</div>}
          </div>
        </li>
      );
    };

    export default UswdsCollectionItem;
