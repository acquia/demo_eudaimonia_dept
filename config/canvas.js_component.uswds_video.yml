js:
  original: |
    import { cn } from 'drupal-canvas';

    const aspectClass = {
      '16-9': 'aspect-video',
      '4-3': 'aspect-[4/3]',
      '1-1': 'aspect-square',
    };

    const getYouTubeId = (src) => {
      const match = src.match(
        /(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/,
      );
      return match ? match[1] : src;
    };

    const getVimeoId = (src) => {
      const match = src.match(/(?:vimeo\.com\/)(\d+)/);
      return match ? match[1] : src;
    };

    const UswdsVideo = ({
      videoSourceUrl = '',
      videoType = 'html5',
      aspectRatio = '16-9',
      caption = '',
      accessibleTitle = 'Embedded video',
      className = '',
    }) => {
      if (!videoSourceUrl) return null;

      const aspect = aspectClass[aspectRatio] ?? aspectClass['16-9'];

      const videoEl =
        videoType === 'youtube' ? (
          <iframe
            src={`https://www.youtube-nocookie.com/embed/${getYouTubeId(videoSourceUrl)}?rel=0`}
            title={accessibleTitle}
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowFullScreen
            className="absolute inset-0 h-full w-full border-0"
          />
        ) : videoType === 'vimeo' ? (
          <iframe
            src={`https://player.vimeo.com/video/${getVimeoId(videoSourceUrl)}`}
            title={accessibleTitle}
            allow="autoplay; fullscreen; picture-in-picture"
            allowFullScreen
            className="absolute inset-0 h-full w-full border-0"
          />
        ) : (
          <video
            className="absolute inset-0 h-full w-full object-cover"
            controls
            title={accessibleTitle}
          >
            <source src={videoSourceUrl} />
            <track kind="captions" />
            Your browser does not support the video element.
          </video>
        );

      return (
        <figure className={cn('usa-video m-0 w-full font-sans', className)}>
          <div className={cn('relative w-full overflow-hidden', aspect)}>
            {videoEl}
          </div>
          {caption && (
            <figcaption className="mt-2 text-sm text-(--color-uswds-base-dark)">
              {caption}
            </figcaption>
          )}
        </figure>
      );
    };

    export default UswdsVideo;
