required: {  }
props:
  videoSourceUrl:
    type: string
    title: 'Video Source / URL'
    examples:
      - 'https://www.youtube.com/watch?v=dQw4w9WgXcQ'
  videoType:
    type: string
    enum:
      - html5
      - youtube
      - vimeo
    'meta:enum':
      html5: 'HTML5 (self-hosted)'
      youtube: YouTube
      vimeo: Vimeo
    title: 'Video Type'
    examples:
      - youtube
  aspectRatio:
    type: string
    enum:
      - 16-9
      - 4-3
      - 1-1
    'meta:enum':
      16-9: '16:9 Widescreen (default)'
      4-3: '4:3 Standard'
      1-1: '1:1 Square'
    title: 'Aspect Ratio'
    examples:
      - 16-9
