js:
  original: |
    import { cva } from 'class-variance-authority';
    import { cn } from 'drupal-canvas';

    // USWDS Tag
    // Figma defines two sizes: default (14px text, 8px px, 1px py) and big (16px text, 8px px, 1px py).
    // Both use base-dark bg (#565c65), white text, uppercase, rounded-sm (2px).
    // Additional color variants are supported for project use but are not in USWDS core Figma.

    const tagVariants = cva(
      'usa-tag inline-flex items-center rounded-sm px-(--spacing-uswds-1) py-px font-sans leading-none uppercase',
      {
        variants: {
          variant: {
            default: 'bg-(--color-uswds-base-dark) text-white',
            informative: 'bg-(--color-uswds-primary) text-white',
            warning: 'bg-(--color-uswds-warning) text-(--color-uswds-base-ink)',
            success: 'bg-(--color-uswds-success) text-white',
            error: 'bg-(--color-uswds-error) text-white',
            cool: 'bg-(--color-uswds-accent-cool) text-(--color-uswds-base-ink)',
            neutral:
              'bg-(--color-uswds-base-lighter) text-(--color-uswds-base-ink)',
          },
          size: {
            // default = 12px
            default: 'text-[12px]',
            // big = 16px (text-[length:var(--font-size-uswds-sm)])
            big: 'text-[length:var(--font-size-uswds-sm)]',
          },
        },
        defaultVariants: {
          variant: 'default',
          size: 'default',
        },
      },
    );

    const UswdsTag = ({
      text = '',
      variant = 'default',
      size = 'default',
      className = '',
    }) => {
      return (
        <span className={cn(tagVariants({ variant, size }), className)}>
          {text}
        </span>
      );
    };

    export default UswdsTag;
