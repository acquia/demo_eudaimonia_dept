js:
  original: |
    import { cva } from 'class-variance-authority';
    import { cn, FormattedText } from 'drupal-canvas';

    const textVariants = cva('usa-body font-sans leading-relaxed', {
      variants: {
        fontSize: {
          xs: 'text-[length:var(--font-size-uswds-xs)]',
          sm: 'text-[length:var(--font-size-uswds-sm)]',
          md: 'text-base',
          lg: 'text-lg',
          xl: 'text-xl',
        },
        textColor: {
          default: 'text-(--color-uswds-base-ink)',
          muted: 'text-(--color-uswds-base-dark)',
          inverse: 'text-white',
        },
        maxWidth: {
          none: '',
          narrow: 'max-w-[60ch]',
          medium: 'max-w-[80ch]',
        },
      },
      defaultVariants: {
        fontSize: 'md',
        textColor: 'default',
        maxWidth: 'none',
      },
    });

    const UswdsText = ({
      text = '',
      fontSize = 'md',
      textColor = 'default',
      maxWidth = 'none',
      className = '',
    }) => {
      if (!text) return null;
      return (
        <FormattedText
          className={cn(textVariants({ fontSize, textColor, maxWidth }), className)}
        >
          {text}
        </FormattedText>
      );
    };

    export default UswdsText;
