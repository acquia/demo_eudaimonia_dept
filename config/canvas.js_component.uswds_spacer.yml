js:
  original: |
    import { cva } from 'class-variance-authority';
    import { cn } from 'drupal-canvas';

    const spacerVariants = cva('usa-spacer block w-full', {
      variants: {
        height: {
          xs: 'h-4',
          sm: 'h-8',
          md: 'h-12',
          lg: 'h-16',
          xl: 'h-24',
          '2xl': 'h-32',
        },
      },
      defaultVariants: {
        height: 'md',
      },
    });

    const UswdsSpacer = ({
      height = 'md',
      className = '',
    }) => (
      <div
        className={cn(spacerVariants({ height }), className)}
        aria-hidden="true"
      />
    );

    export default UswdsSpacer;
