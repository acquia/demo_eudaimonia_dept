js:
  original: |
    import { useState } from 'react';
    import UswdsDatePicker from '@/components/uswds_date_picker';
    import { cn } from 'drupal-canvas';

    function formatForPicker(date) {
      if (!date) return '';
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${m}/${d}/${date.getFullYear()}`;
    }

    const UswdsDateRangePicker = ({
      startLabel = 'Start date',
      endLabel = 'End date',
      name = '',
      hint = '',
      minDate = '',
      maxDate = '',
      className = '',
    }) => {
      const [startDate, setStartDate] = useState(null);
      const [endDate, setEndDate] = useState(null);

      const handleStartChange = (date) => {
        setStartDate(date);
        if (endDate && date > endDate) setEndDate(null);
      };

      const handleEndChange = (date) => {
        setEndDate(date);
      };

      return (
        <fieldset className={cn('usa-date-range-picker m-0 border-0 p-0 font-sans', className)}>
          <div className="flex flex-col gap-4">
            <UswdsDatePicker
              label={startLabel}
              name={name ? `${name}-start` : 'range-start'}
              hint={hint}
              minDate={minDate}
              maxDate={endDate ? formatForPicker(endDate) : maxDate}
              onDateChange={handleStartChange}
              rangeStart={startDate}
              rangeEnd={endDate}
            />
            <UswdsDatePicker
              label={endLabel}
              name={name ? `${name}-end` : 'range-end'}
              hint={hint}
              minDate={startDate ? formatForPicker(startDate) : minDate}
              maxDate={maxDate}
              onDateChange={handleEndChange}
              rangeStart={startDate}
              rangeEnd={endDate}
            />
          </div>
        </fieldset>
      );
    };

    export default UswdsDateRangePicker;
