js:
  original: |
    import { useEffect, useRef, useState } from 'react';
    import { cn } from 'drupal-canvas';

    const FOCUSABLE =
      'button:not([disabled]),[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';

    const UswdsModal = ({
      id = 'modal',
      heading = '',
      body,
      footer,
      triggerText = 'Open modal',
      size = 'default',
      forcedActionNoDismiss = false,
      className = '',
    }) => {
      const [open, setOpen] = useState(false);
      const dialogRef = useRef(null);
      const maxWidth = size === 'lg' ? 'max-w-[880px]' : 'max-w-[480px]';

      useEffect(() => {
        if (!open) return;
        const dialog = dialogRef.current;

        // Move focus into dialog on open
        const focusable = dialog?.querySelectorAll(FOCUSABLE);
        (focusable?.[0] ?? dialog)?.focus();

        const handleKeyDown = (e) => {
          if (e.key === 'Escape' && !forcedActionNoDismiss) {
            setOpen(false);
            return;
          }
          if (e.key === 'Tab' && dialog) {
            const all = Array.from(dialog.querySelectorAll(FOCUSABLE));
            if (all.length === 0) return;
            const first = all[0];
            const last = all[all.length - 1];
            if (e.shiftKey) {
              if (document.activeElement === first) {
                e.preventDefault();
                last.focus();
              }
            } else {
              if (document.activeElement === last) {
                e.preventDefault();
                first.focus();
              }
            }
          }
        };

        document.addEventListener('keydown', handleKeyDown);
        return () => document.removeEventListener('keydown', handleKeyDown);
      }, [open, forcedActionNoDismiss]);

      return (
        <>
          <button
            type="button"
            onClick={() => setOpen(true)}
            className="usa-button rounded bg-(--color-uswds-primary) px-(--spacing-uswds-205) py-(--spacing-uswds-105) font-sans text-[length:--font-size-uswds-sm] leading-[0.95] font-bold text-white hover:bg-(--color-uswds-primary-dark) focus-visible:outline-2 focus-visible:outline-offset-(--uswds-focus-offset) focus-visible:outline-(--uswds-focus-color)"
            aria-controls={id}
          >
            {triggerText}
          </button>

          {open && (
            <div
              role="presentation"
              className="usa-overlay fixed inset-0 z-50 flex items-center justify-center bg-black/70 p-[50px]"
              onClick={(e) => {
                if (!forcedActionNoDismiss && e.target === e.currentTarget)
                  setOpen(false);
              }}
            >
              <div
                ref={dialogRef}
                id={id}
                role="dialog"
                aria-modal="true"
                aria-labelledby={`${id}-heading`}
                tabIndex={-1}
                className={cn(
                  'usa-modal relative flex w-full flex-col overflow-y-auto rounded-lg bg-white font-sans',
                  maxWidth,
                  className,
                )}
              >
                {/* Top spacer */}
                <div className="h-8 shrink-0" aria-hidden="true" />

                {/* Content */}
                <div className="usa-modal__content flex flex-col gap-6 px-8 pt-2 pb-8">
                  <div className="flex flex-col gap-4 text-(--color-uswds-base-ink)">
                    <h2
                      id={`${id}-heading`}
                      className="usa-modal__heading text-[length:--font-size-uswds-lg] leading-normal font-bold"
                    >
                      {heading}
                    </h2>
                    {body && (
                      <div className="text-[length:--font-size-uswds-sm] leading-relaxed">
                        {body}
                      </div>
                    )}
                  </div>

                  {/* Actions */}
                  <div className="flex items-center">
                    <div className="flex items-center gap-2">
                      {footer}
                      {!forcedActionNoDismiss && (
                        <button
                          type="button"
                          onClick={() => setOpen(false)}
                          className="usa-button usa-button--unstyled px-(--spacing-uswds-1) py-(--spacing-uswds-1) text-[length:--font-size-uswds-sm] leading-[0.95] font-normal text-(--color-uswds-primary) underline decoration-solid [text-decoration-skip-ink:none] hover:text-(--color-uswds-primary-dark) focus-visible:outline-2 focus-visible:outline-offset-(--uswds-focus-offset) focus-visible:outline-(--uswds-focus-color)"
                        >
                          Cancel
                        </button>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}
        </>
      );
    };

    export default UswdsModal;
