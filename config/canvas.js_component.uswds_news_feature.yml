js:
  original: |
    import { cn } from 'drupal-canvas';

    // USWDS News Feature
    // Large featured news/press-release card used in a news section alongside
    // a collection list. Has a gradient image placeholder (no real image needed),
    // a "Featured Story" badge, date + category, serif heading, body, and CTA.

    const UswdsNewsFeature = ({
      date = '',
      category = '',
      heading = '',
      body = '',
      ctaText = 'Read full release',
      ctaLink = '#',
      className = '',
    }) => {
      const meta = [date, category].filter(Boolean).join(' · ');

      return (
        <article
          className={cn(
            'usa-card flex flex-col overflow-hidden rounded-sm border border-(--color-uswds-base-lighter) bg-white font-sans',
            className,
          )}
        >
          {/* Gradient image placeholder */}
          <div
            className="relative h-72 shrink-0"
            style={{
              background:
                'linear-gradient(135deg, rgba(22,46,81,.85), rgba(0,94,162,.5)), radial-gradient(circle at 35% 65%, rgba(222,198,154,.55), transparent 45%), linear-gradient(180deg, var(--color-uswds-primary-dark), var(--color-uswds-primary-darker))',
            }}
            aria-hidden="true"
          >
            <span className="absolute bottom-4 left-6 rounded-sm bg-black/45 px-2.5 py-1.5 text-xs font-bold tracking-[1.5px] text-white uppercase">
              Featured Story
            </span>
          </div>

          {/* Body */}
          <div className="flex flex-1 flex-col p-7">
            {meta && (
              <p className="mb-2 text-[13px] font-normal tracking-[.8px] text-(--color-uswds-base-dark) uppercase">
                {meta}
              </p>
            )}

            {heading && (
              <h3 className="mb-3 font-serif text-[26px] leading-snug font-bold text-(--color-uswds-primary-darker)">
                {heading}
              </h3>
            )}

            {body && (
              <p className="mb-4 flex-1 text-[15px] leading-relaxed text-(--color-uswds-base-dark)">
                {body}
              </p>
            )}

            {ctaText && (
              <a
                href={ctaLink}
                className="inline-flex items-center gap-1.5 text-sm font-bold text-(--color-uswds-primary) no-underline hover:underline"
              >
                {ctaText}
                <svg
                  viewBox="0 0 24 24"
                  className="h-4 w-4 shrink-0"
                  aria-hidden="true"
                >
                  <path
                    d="M9 6l6 6-6 6"
                    stroke="currentColor"
                    strokeWidth="2.5"
                    fill="none"
                  />
                </svg>
              </a>
            )}
          </div>
        </article>
      );
    };

    export default UswdsNewsFeature;
