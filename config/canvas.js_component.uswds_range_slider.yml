js:
  original: |
    import { useState } from 'react';
    import UswdsLabel from '@/components/uswds_label';
    import { cn } from 'drupal-canvas';

    const UswdsRangeSlider = ({
      label = '',
      name = '',
      min = 0,
      max = 100,
      step = 1,
      value: defaultValue,
      className = '',
    }) => {
      const [value, setValue] = useState(defaultValue ?? min);
      const id = `range-${name}`;

      return (
        <div className={cn('flex flex-col gap-2 font-sans', className)}>
          {label && <UswdsLabel labelText={label} htmlFor={id} />}
          <input
            id={id}
            type="range"
            name={name}
            min={min}
            max={max}
            step={step}
            value={value}
            onChange={(e) => setValue(Number(e.target.value))}
            className="w-full accent-(--color-uswds-primary) focus-visible:outline-2 focus-visible:outline-offset-(--uswds-focus-offset) focus-visible:outline-(--uswds-focus-color)"
          />
        </div>
      );
    };

    export default UswdsRangeSlider;
