            <td
              key={i}
              style={textValue ? { color: textValue } : undefined}
              className={cn(
                cellPadding,
                bordered && 'border border-(--color-uswds-base-ink)',
                stacked && 'block before:mr-2 before:font-bold before:content-[attr(data-label)]',
              )}
              data-label={headerLabels[i] ?? ''}
            >
              {cell}
            </td>
          ))}
        </tr>
      );
    };

    export default UswdsTableRow;
