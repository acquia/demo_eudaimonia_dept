    import { cn } from 'drupal-canvas';

    const BG_MAP = {
      white: 'white',
      gray: 'var(--color-uswds-base-lightest)',
      'primary-lightest': 'var(--color-uswds-primary-lightest)',
      'primary-lighter': 'var(--color-uswds-primary-lighter)',
      primary: 'var(--color-uswds-primary)',
      'primary-dark': 'var(--color-uswds-primary-dark)',
      'primary-darker': 'var(--color-uswds-primary-darker)',
      'base-lighter': 'var(--color-uswds-base-lighter)',
      'base-dark': 'var(--color-uswds-base-dark)',
      'base-darkest': 'var(--color-uswds-base-darkest)',
    };

    const TEXT_COLOR_MAP = {
      light: 'white',
      dark: 'var(--color-uswds-base-ink)',
      primary: 'var(--color-uswds-primary-darker)',
      secondary: 'var(--color-eud-gold)',
    };

    const UswdsTableRow = ({ cells = [], isHeader = false, backgroundColor = '', textColor = '', _tableCtx = {} }) => {
      const { bordered = false, compact = false, stacked = false, headerLabels = [] } = _tableCtx;

      const cellPadding = compact ? 'px-4 py-2' : 'px-4 py-3';
      const bgValue = backgroundColor ? BG_MAP[backgroundColor] : undefined;
      const textValue = textColor ? TEXT_COLOR_MAP[textColor] : undefined;
      const rowStyle = bgValue ? { backgroundColor: bgValue } : undefined;

      if (isHeader) {
        const defaultBg = bgValue ?? 'var(--color-uswds-base-lighter)';
        const defaultText = textValue ?? 'var(--color-uswds-base-ink)';
        return (
          <tr className="border-b-2 border-(--color-uswds-base-ink)">
            {cells.map((cell, i) => (
              <th
                key={i}
                scope="col"
                style={{ backgroundColor: defaultBg, color: defaultText }}
                className={cn(
                  'text-left text-sm font-bold',
                  cellPadding,
                  bordered && 'border border-(--color-uswds-base-ink)',
                )}
              >
                {cell}
              </th>
            ))}
          </tr>
        );
      }

      return (
        <tr className="border-b border-(--color-uswds-base-lighter)" style={rowStyle}>
