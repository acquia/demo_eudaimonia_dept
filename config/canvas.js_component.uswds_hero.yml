js:
  original: |
    import { cn } from 'drupal-canvas';

    // USWDS Hero
    // Dark navy section used at the top of agency home pages.
    // Eyebrow (gold, uppercase), large serif heading, leadParagraph paragraph,
    // CTA buttons (ctas slot), optional Quick Access widget (quick_access slot).
    // When quick_access is present the layout becomes 2-column.

    const UswdsHero = ({
      eyebrow = '',
      heading = '',
      leadParagraph = '',
      ctas,
      quick_access,
      className = '',
    }) => {
      const hasWidget = Boolean(quick_access);

      return (
        <div
          className={cn(
            'usa-hero relative w-full overflow-hidden bg-(--color-uswds-primary-darker) font-sans',
            className,
          )}
        >
          {/* Subtle radial gradients for depth — decorative overlay, no token equivalent for rgba transparency */}
          <div
            className="pointer-events-none absolute inset-0 [background:radial-gradient(circle_at_80%_20%,rgba(222,198,154,.14),transparent_50%),radial-gradient(circle_at_20%_90%,rgba(115,179,231,.08),transparent_50%)]"
            aria-hidden="true"
          />

          <div
            className={cn(
              'relative z-10 mx-auto max-w-[1240px] px-8 py-20',
              hasWidget
                ? 'flex flex-col items-start gap-16 lg:flex-row lg:items-center'
                : '',
            )}
          >
            {/* Left: text + CTAs */}
            <div className={cn('min-w-0', hasWidget ? 'flex-1' : '')}>
              {eyebrow && (
                <div className="mb-5 flex items-center gap-2.5 text-[13px] font-bold tracking-[1.5px] text-(--color-eud-gold) uppercase">
                  <span
                    className="inline-block h-0.5 w-8 shrink-0 bg-(--color-eud-gold)"
                    aria-hidden="true"
                  />
                  {eyebrow}
                </div>
              )}

              {heading && (
                <h1 className="mb-5 font-serif text-[54px] leading-[1.1] font-black tracking-tight text-white">
                  {heading}
                </h1>
              )}

              {leadParagraph && (
                <p className="mb-8 max-w-2xl text-xl leading-[1.55] text-white/85">
                  {leadParagraph}
                </p>
              )}

              {ctas && <div className="flex flex-wrap gap-3">{ctas}</div>}
            </div>

            {/* Right: Quick Access widget */}
            {hasWidget && (
              <div className="w-full shrink-0 lg:w-80">{quick_access}</div>
            )}
          </div>
        </div>
      );
    };

    export default UswdsHero;
