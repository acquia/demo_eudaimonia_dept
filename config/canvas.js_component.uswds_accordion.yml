js:
  original: |
    import { Children, cloneElement, isValidElement } from 'react';
    import { cn } from 'drupal-canvas';

    const UswdsAccordion = ({
      items,
      bordered = false,
      multiselectable = false,
      variant = 'default',
      className = '',
    }) => {
      const injectedItems = Children.map(items, (child) =>
        isValidElement(child) ? cloneElement(child, { bordered, variant }) : child,
      );

      return (
        <div
          className={cn('usa-accordion flex w-full flex-col gap-2 font-sans', className)}
          data-allow-multiple={multiselectable || undefined}
        >
          {injectedItems}
        </div>
      );
    };

    export default UswdsAccordion;
