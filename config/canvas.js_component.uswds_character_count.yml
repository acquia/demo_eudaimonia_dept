js:
  original: |
    import { useState } from 'react';
    import UswdsLabel from '@/components/uswds_label';
    import { cn } from 'drupal-canvas';

    const UswdsCharacterCount = ({
      maxLength = 100,
      label = '',
      name = '',
      hint = '',
      multiline = false,
      className = '',
    }) => {
      const [count, setCount] = useState(0);
      const remaining = maxLength - count;
      const isOver = remaining < 0;
      const id = `char-count-${name}`;

      const inputStyles =
        'usa-input w-full border-2 border-(--color-uswds-base) px-(--spacing-uswds-1) py-(--spacing-uswds-105) text-(--color-uswds-base-ink) font-sans text-base bg-white focus:outline-none focus:border-(--uswds-focus-color) focus:outline-2 focus:outline-(--uswds-focus-color) focus:outline-offset-0';

      return (
        <div className={cn('usa-character-count flex flex-col gap-1 font-sans', className)}>
          {label && <UswdsLabel labelText={label} htmlFor={id} hintText={hint} />}
          {multiline ? (
            <textarea
              id={id}
              name={name}
              maxLength={maxLength}
              rows={4}
              className={cn(inputStyles, 'resize-y')}
              onChange={(e) => setCount(e.target.value.length)}
            />
          ) : (
            <input
              id={id}
              type="text"
              name={name}
              maxLength={maxLength}
              className={inputStyles}
              onChange={(e) => setCount(e.target.value.length)}
            />
          )}
          <span
            className={cn(
              'usa-character-count__status text-sm',
              isOver
                ? 'font-bold text-(--color-uswds-error)'
                : 'text-(--color-uswds-base)',
            )}
            aria-live="polite"
          >
            {isOver
              ? `${Math.abs(remaining)} characters over limit`
              : `${remaining} characters allowed`}
          </span>
        </div>
      );
    };

    export default UswdsCharacterCount;
