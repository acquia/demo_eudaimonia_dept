js:
  original: |
    import { cn, FormattedText } from 'drupal-canvas';

    const CardChevron = () => (
      <svg
        aria-hidden="true"
        focusable="false"
        className="h-4 w-4 shrink-0"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        strokeWidth="2.5"
      >
        <path d="M9 6l6 6-6 6" />
      </svg>
    );

    const UswdsCard = ({
      heading = '',
      headingLevel = 'h3',
      body = '',
      tag = '',
      ctaText = '',
      ctaLink = '',
      layout = 'default',
      mediaFirst = true,
      mediaExdent = true,
      mediaInset = false,
      mediaPosition = 'left',
      icon,
      media,
      footer,
      className = '',
    }) => {
      const HeadingTag = headingLevel;
      const isFlag = layout === 'flag';
      // Simple presence check — tile ownership lives on the icon child (showTile prop)
      const hasMedia = !!media;

      // Vertical card: media wrapper padding based on exdent/inset
      const verticalMediaClass = cn(
        'w-full shrink-0 overflow-hidden',
        !mediaExdent && 'px-(--spacing-uswds-3)',
        mediaInset && 'py-(--spacing-uswds-3)',
      );

      // Flag card: media wrapper width + optional gap/inset
      const flagMediaClass = cn(
        'flex w-[240px] shrink-0 items-stretch overflow-hidden',
        !mediaExdent &&
        (mediaPosition === 'left'
          ? 'my-(--spacing-uswds-3) ml-(--spacing-uswds-3)'
          : 'my-(--spacing-uswds-3) mr-(--spacing-uswds-3)'),
        mediaInset &&
        (mediaPosition === 'left'
          ? 'py-(--spacing-uswds-3) pl-(--spacing-uswds-3)'
          : 'py-(--spacing-uswds-3) pr-(--spacing-uswds-3)'),
      );

      const content = (
        <div className="usa-card__body flex flex-1 flex-col gap-3 p-(--spacing-uswds-3)">
          {/* Icon tile rendered by the child component (uswds_icon / uswds_icon_image) via showTile prop */}
          {icon}
          {tag && (
            <span className="self-start rounded-sm bg-(--color-uswds-primary-lighter) px-2 py-1 text-[12px] font-bold tracking-[.6px] text-(--color-uswds-primary-darker) uppercase">
              {tag}
            </span>
          )}
          {heading && (
            <HeadingTag className="usa-card__heading m-0 font-serif text-[22px] leading-[1.15] font-bold text-(--color-uswds-primary-darker)">
              {heading}
            </HeadingTag>
          )}
          {body && (
            <div className="flex-1 text-[15px] leading-[1.6] text-(--color-uswds-base-dark)">
              <FormattedText>{body}</FormattedText>
            </div>
          )}
          {ctaText && ctaLink && (
            <a
              href={ctaLink}
              className="mt-auto inline-flex items-center gap-1.5 pt-2 text-[15px] font-bold text-(--color-uswds-primary) no-underline hover:underline"
            >
              {ctaText}
              <CardChevron />
            </a>
          )}
          {footer && <div className="shrink-0">{footer}</div>}
        </div>
      );

      if (isFlag) {
        return (
          <div
            className={cn(
              'usa-card usa-card--flag flex flex-row items-stretch overflow-hidden rounded border border-(--color-uswds-base-lighter) bg-white font-sans transition-[box-shadow,transform] duration-200 hover:-translate-y-0.5 hover:shadow-md',
              className,
            )}
          >
            {hasMedia && mediaPosition === 'left' && (
              <div className={flagMediaClass}>{media}</div>
            )}
            {content}
            {hasMedia && mediaPosition === 'right' && (
              <div className={flagMediaClass}>{media}</div>
            )}
          </div>
        );
      }

      return (
        <div
          className={cn(
            'usa-card flex flex-col overflow-hidden rounded border border-(--color-uswds-base-lighter) bg-white font-sans transition-[box-shadow,transform] duration-200 hover:-translate-y-0.5 hover:shadow-md',
            className,
          )}
        >
          {hasMedia && mediaFirst && (
            <div className={verticalMediaClass}>{media}</div>
          )}
          {content}
          {hasMedia && !mediaFirst && (
            <div className={verticalMediaClass}>{media}</div>
          )}
        </div>
      );
    };

    export default UswdsCard;
