js:
  original: |
    import { cn } from 'drupal-canvas';

    /**
     * UswdsSideNavigation renders hierarchical side navigation.
     *
     * The `items` slot accepts UswdsSideNavigationItem components.
     * Each item should pass: text, href, current, level (1|2|3).
     */
    const UswdsSideNavigation = ({ heading = '', items, className = '' }) => {
      return (
        <nav
          aria-label={heading || 'Side navigation'}
          className={cn('usa-sidenav font-sans', className)}
        >
          <ul className="usa-sidenav m-0 list-none p-0">{items}</ul>
        </nav>
      );
    };

    export default UswdsSideNavigation;
