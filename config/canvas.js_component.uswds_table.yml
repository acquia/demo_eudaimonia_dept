js:
  original: |
    import { Children, cloneElement } from 'react';
    import { cn } from 'drupal-canvas';

    const UswdsTable = ({
      rows,
      caption = '',
      striped = false,
      bordered = false,
      compact = false,
      stacked = false,
      className = '',
    }) => {
      // Extract header labels from the header row child for stacked data-label support
      const kids = Children.toArray(rows);
      const headerRow = kids.find((child) => child?.props?.isHeader);
      const headerLabels = headerRow?.props?.cells ?? [];

      // Inject table config into each row child via cloneElement
      const tableCtx = { bordered, compact, stacked, headerLabels };
      const inject = (child) => (child ? cloneElement(child, { _tableCtx: tableCtx }) : child);

      const headerRows = kids.filter((c) => c?.props?.isHeader).map(inject);
      const bodyRows = kids.filter((c) => !c?.props?.isHeader).map(inject);

      return (
        <div className={cn('w-full overflow-x-auto font-sans', className)}>
          <table
            className={cn(
              'usa-table w-full border-collapse text-sm text-(--color-uswds-base-ink)',
              bordered && 'usa-table--bordered border border-(--color-uswds-base-ink)',
              striped && 'usa-table--striped [&>tbody>tr:nth-child(even)]:bg-(--color-uswds-base-lightest)',
              compact && 'usa-table--compact',
              stacked && 'usa-table--stacked',
            )}
          >
            {caption && (
              <caption className="caption-top pb-2 text-left text-sm font-bold text-(--color-uswds-base-ink)">
                {caption}
              </caption>
            )}
            {headerRows.length > 0 && <thead>{headerRows}</thead>}
            {bodyRows.length > 0 && <tbody>{bodyRows}</tbody>}
          </table>
        </div>
      );
    };

    export default UswdsTable;
