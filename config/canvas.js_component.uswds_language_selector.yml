    const UswdsLanguageSelector = ({
      items,
      buttonType = 'primary',
      showIcon = false,
      className = '',
    }) => {
      const [open, setOpen] = useState(false);
      const [pos, setPos] = useState({ top: 0, right: 0 });
      const btnRef = useRef(null);
      const listRef = useRef(null);
      const isLink = buttonType === 'link';

      const handleToggle = () => {
        if (!open && btnRef.current) {
          const r = btnRef.current.getBoundingClientRect();
          setPos({
            top: r.bottom + window.scrollY + 2,
            right: window.innerWidth - r.right,
          });
        }
        setOpen((o) => !o);
      };

      // Close on outside click — check both the button and the dropdown list
      useEffect(() => {
        if (!open) return;
        const close = (e) => {
          if (
            btnRef.current &&
            !btnRef.current.contains(e.target) &&
            listRef.current &&
            !listRef.current.contains(e.target)
          ) {
            setOpen(false);
          }
        };
        document.addEventListener('mousedown', close);
        return () => document.removeEventListener('mousedown', close);
      }, [open]);

      return (
        <nav
          aria-label="Language selector"
          className={cn('usa-language-selector relative w-fit font-sans', className)}
        >
          <button
            ref={btnRef}
            type="button"
            onClick={handleToggle}
            aria-expanded={open}
            aria-haspopup="true"
            className={cn(
              'text-[length:--font-size-uswds-sm] leading-[0.95] focus-visible:outline-2 focus-visible:outline-offset-(--uswds-focus-offset) focus-visible:outline-(--uswds-focus-color)',
              isLink
                ? 'font-normal text-(--color-uswds-primary) underline decoration-solid [text-decoration-skip-ink:none] hover:text-(--color-uswds-primary-dark)'
                : 'flex items-center gap-2 rounded bg-(--color-uswds-primary) px-(--spacing-uswds-205) py-(--spacing-uswds-105) font-bold text-white hover:bg-(--color-uswds-primary-dark)',
            )}
          >
            {!isLink && showIcon && (
              <svg
                viewBox="0 0 24 24"
                className="h-3.5 w-3.5 shrink-0 fill-current"
                aria-hidden="true"
                focusable="false"
                dangerouslySetInnerHTML={{ __html: LANGUAGE_ICON }}
              />
            )}
            Languages
            {!isLink && (
              <svg
                viewBox="0 0 10 6"
                fill="currentColor"
                className={cn(
                  'h-[10px] w-[10px] shrink-0 transition-transform',
                  open && 'rotate-180',
                )}
                aria-hidden="true"
              >
                <path d="M0 0l5 6 5-6z" />
              </svg>
            )}
          </button>

          {/* Dropdown rendered via portal — immune to z-index/overflow clipping */}
          {open &&
            items &&
            typeof document !== 'undefined' &&
            createPortal(
              <ul
                ref={listRef}
                style={{
                  position: 'fixed',
                  top: pos.top - window.scrollY,
                  right: pos.right,
                  zIndex: 9999,
                }}
                className="m-0 min-w-[240px] list-none overflow-hidden bg-(--color-uswds-primary-darker) p-0 shadow-[0_4px_12px_rgba(0,0,0,.2)]"
              >
                {items}
              </ul>,
              document.body,
            )}
        </nav>
      );
    };

    export default UswdsLanguageSelector;
