js:
  original: |
    import { cn } from 'drupal-canvas';

    // Figma: USA Icon List uses gap-3 (12px) between items, text at 16px body size.
    // Items are flex rows with an 8px gap between the 24px icon and text.
    const UswdsIconList = ({ items, className = '' }) => {
      return (
        <ul
          className={cn(
            'usa-icon-list m-0 flex list-none flex-col gap-3 p-0 font-sans',
            className,
          )}
        >
          {items}
        </ul>
      );
    };

    export default UswdsIconList;
