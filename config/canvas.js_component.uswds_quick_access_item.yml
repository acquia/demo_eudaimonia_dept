js:
  original: |
    import { cn } from 'drupal-canvas';

    // USWDS Quick Access Item
    // Row in a Quick Access widget: label on left, small CTA link on right.
    // Separated by a subtle bottom border.

    const UswdsQuickAccessItem = ({
      label = '',
      ctaText = 'Open',
      ctaLink = '#',
      className = '',
    }) => {
      return (
        <li
          className={cn(
            'flex items-center justify-between border-b border-(--color-uswds-base-lighter) py-[11px] font-sans text-sm last:border-b-0',
            className,
          )}
        >
          <span className="text-(--color-uswds-base-ink)">{label}</span>
          <a
            href={ctaLink}
            className="flex items-center gap-1 font-bold text-(--color-uswds-primary) no-underline hover:underline"
          >
            {ctaText}
            <svg
              viewBox="0 0 24 24"
              className="h-3 w-3 shrink-0"
              aria-hidden="true"
            >
              <path
                d="M9 6l6 6-6 6"
                stroke="currentColor"
                strokeWidth="2.5"
                fill="none"
              />
            </svg>
          </a>
        </li>
      );
    };

    export default UswdsQuickAccessItem;
