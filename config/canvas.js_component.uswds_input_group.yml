js:
  original: |
    import { cn } from 'drupal-canvas';

    const UswdsInputGroup = ({
      labelText = '',
      htmlFor = '',
      required = false,
      hintText = '',
      errorText = '',
      state = 'default',
      marginTopSpacingForErrorWithOffset = false,
      children,
      className = '',
    }) => {
      const isError = state === 'error';

      return (
        <div
          className={cn(
            'usa-form-group relative flex flex-col font-sans',
            isError ? 'gap-0' : 'gap-(--spacing-uswds-1)',
            marginTopSpacingForErrorWithOffset &&
              isError &&
              'pt-(--spacing-uswds-3)',
            marginTopSpacingForErrorWithOffset &&
              !isError &&
              'gap-(--spacing-uswds-1)',
            className,
          )}
        >
          {/* Error indicator bar */}
          {isError && (
            <div
              className={cn(
                'absolute left-[-20px] w-1 bg-(--color-uswds-error-dark)',
                marginTopSpacingForErrorWithOffset
                  ? 'top-(--spacing-uswds-3) bottom-0'
                  : 'top-0 bottom-0',
              )}
              aria-hidden="true"
            />
          )}

          {/* Label area */}
          <div
            className={cn(
              'flex flex-col gap-(--spacing-uswds-1)',
              isError ? 'gap-(--spacing-uswds-1)' : '',
            )}
          >
            {labelText && (
              <label
                htmlFor={htmlFor}
                className={cn(
                  'usa-label text-[length:--font-size-uswds-sm] leading-normal text-(--color-uswds-base-ink)',
                  isError ? 'font-bold' : 'font-normal',
                )}
              >
                {labelText}
                {required && (
                  <span
                    className="text-(--color-uswds-error-dark)"
                    aria-hidden="true"
                  >
                    *
                  </span>
                )}
              </label>
            )}
            {hintText && (
              <span className="usa-hint text-[length:--font-size-uswds-sm] leading-normal text-(--color-uswds-base)">
                {hintText}
              </span>
            )}
            {isError && errorText && (
              <span className="usa-error-message text-[length:--font-size-uswds-sm] leading-normal font-bold text-(--color-uswds-error-dark)">
                {errorText}
              </span>
            )}
          </div>

          {/* Input slot */}
          {children}
        </div>
      );
    };

    export default UswdsInputGroup;
