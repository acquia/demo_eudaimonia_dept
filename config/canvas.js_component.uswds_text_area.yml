js:
  original: |
    import UswdsLabel from '@/components/uswds_label';
    import { cn } from 'drupal-canvas';

    // USWDS Text Area
    // Figma states: default, disabled, error, success
    // default/success: 1px border, base-ink color; error/success: 4px border
    // error border = error-dark (#b50909); success border = success-dark (#008817)
    // disabled: bg = disabled-medium (#757575), 1px border base-ink
    // Focus ring: 4px solid focus-color (#2491ff) inset outline

    const UswdsTextArea = ({
      label = '',
      name = '',
      placeholder = '',
      hint = '',
      error = '',
      success = false,
      disabled = false,
      required = false,
      rows = 4,
      className = '',
    }) => {
      const id = `textarea-${name}`;
      const hasError = Boolean(error);

      return (
        <div className={cn('usa-form-group flex flex-col gap-2 font-sans', className)}>
          {label && (
            <UswdsLabel
              labelText={label}
              htmlFor={id}
              required={required}
              hintText={hint}
            />
          )}
          {hasError && (
            <span
              id={`${id}-error`}
              className="usa-error-message text-[length:var(--font-size-uswds-sm)] font-bold text-(--color-uswds-error-dark)"
            >
              {error}
            </span>
          )}
          <textarea
            id={id}
            name={name}
            placeholder={placeholder}
            required={required}
            disabled={disabled}
            rows={rows}
            aria-describedby={hasError ? `${id}-error` : undefined}
            aria-invalid={hasError ? 'true' : undefined}
            className={cn(
              'usa-textarea w-full resize-y px-(--spacing-uswds-1) py-(--spacing-uswds-105) font-sans text-[length:var(--font-size-uswds-sm)] text-(--color-uswds-base-ink)',
              'focus:ring-4 focus:ring-(--uswds-focus-color) focus:ring-offset-0 focus:outline-none',
              // Default state
              !hasError &&
                !success &&
                !disabled &&
                'border border-(--color-uswds-base-ink) bg-white',
              // Error state: 4px border, error-dark color
              hasError && 'border-4 border-(--color-uswds-error-dark) bg-white',
              // Success state: 4px border, success-dark color
              success &&
                !hasError &&
                'border-4 border-(--color-uswds-success-dark) bg-white',
              // Disabled state
              disabled &&
                'cursor-not-allowed border border-(--color-uswds-base-ink) bg-(--color-uswds-disabled-medium)',
            )}
          />
        </div>
      );
    };

    export default UswdsTextArea;
