js:
  original: |
    import { cn, FormattedText } from 'drupal-canvas';

    // USWDS Summary Box
    // Figma: bg = accent-cool-lightest (#e7f6f8), border = 1px solid info (#5dbbcc → accent-cool-light),
    // rounded-[4px], heading = 22px bold (#1b1b1b), body = 16px normal (#1b1b1b), padding = 24px.

    const UswdsSummaryBox = ({
      heading = 'Key information',
      body = '',
      items,
      className = '',
    }) => {
      return (
        <div
          className={cn(
            'usa-summary-box rounded border border-(--color-uswds-accent-cool-light) bg-(--color-uswds-accent-cool-lightest) p-6 font-sans text-(--color-uswds-base-ink)',
            className,
          )}
        >
          {heading && (
            <h3 className="usa-summary-box__heading mb-2 font-serif text-[length:var(--font-size-uswds-lg)] leading-snug font-bold text-(--color-uswds-primary-darker)">
              {heading}
            </h3>
          )}
          {body && (
            <FormattedText className="usa-summary-box__body text-[length:var(--font-size-uswds-sm)] leading-relaxed [&_li]:mb-1 [&_ol]:list-decimal [&_ol]:pl-5 [&_ul]:list-disc [&_ul]:pl-5">
              {body}
            </FormattedText>
          )}
          {items && <div className="mt-2">{items}</div>}
        </div>
      );
    };

    export default UswdsSummaryBox;
