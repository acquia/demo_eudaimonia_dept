  original: |
    import { cn } from 'drupal-canvas';

    const UswdsCollectionMetaItem = ({
      text = '',
      dotSeparator = false,
      className = '',
    }) => {
      if (dotSeparator) {
        return (
          <span
            aria-hidden="true"
            className="text-(--color-uswds-base-light) select-none"
          >
            ·
          </span>
        );
      }
      if (!text) return null;
      return (
        <span
          className={cn(
            'usa-collection__meta-item text-[13px] leading-[1.35] text-(--color-uswds-base-ink)',
            className,
          )}
        >
          {text}
        </span>
      );
    };

    export default UswdsCollectionMetaItem;
