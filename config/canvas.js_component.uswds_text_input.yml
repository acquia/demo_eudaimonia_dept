js:
  original: |
    import UswdsLabel from '@/components/uswds_label';
    import { cn } from 'drupal-canvas';

    // USWDS Text Input
    // Figma states: default, disabled, error, success
    // default: 1px border base-ink, white bg, h-10
    // error: 4px border error-dark (#b50909), white bg
    // success: 4px border success-dark (#008817), white bg
    // disabled: 1px border base-ink, bg = disabled-medium (#757575)
    // Width variants: default (full), 2xs, xs, sm, md, lg, xl, 2xl (fixed max-widths per USWDS)

    const widthClasses = {
      default: 'w-full',
      '2xs': 'max-w-[5ch] w-full',
      xs: 'max-w-[9ch] w-full',
      sm: 'max-w-[13ch] w-full',
      md: 'max-w-[20ch] w-full',
      lg: 'max-w-[30ch] w-full',
      xl: 'max-w-[40ch] w-full',
      '2xl': 'max-w-[50ch] w-full',
    };

    const UswdsTextInput = ({
      label = '',
      name = '',
      placeholder = '',
      type = 'text',
      hint = '',
      error = '',
      success = false,
      required = false,
      disabled = false,
      width = 'default',
      className = '',
    }) => {
      const id = `input-${name}`;
      const hasError = Boolean(error);

      return (
        <div className={cn('usa-form-group flex flex-col gap-2 font-sans', className)}>
          {label && (
            <UswdsLabel
              labelText={label}
              htmlFor={id}
              required={required}
              hintText={hint}
            />
          )}
          {hasError && (
            <span
              id={`${id}-error`}
              className="usa-error-message text-[length:var(--font-size-uswds-sm)] font-bold text-(--color-uswds-error-dark)"
            >
              {error}
            </span>
          )}
          <input
            id={id}
            type={type}
            name={name}
            placeholder={placeholder}
            required={required}
            disabled={disabled}
            aria-describedby={hasError ? `${id}-error` : undefined}
            aria-invalid={hasError ? 'true' : undefined}
            className={cn(
              'usa-input h-10 px-(--spacing-uswds-1) font-sans text-[length:var(--font-size-uswds-sm)] text-(--color-uswds-base-ink)',
              'focus:ring-4 focus:ring-(--uswds-focus-color) focus:ring-offset-0 focus:outline-none',
              widthClasses[width] ?? widthClasses.default,
              // Default state
              !hasError &&
                !success &&
                !disabled &&
                'border border-(--color-uswds-base-ink) bg-white',
              // Error state: 4px border, error-dark
              hasError && 'border-4 border-(--color-uswds-error-dark) bg-white',
              // Success state: 4px border, success-dark
              success &&
                !hasError &&
                'border-4 border-(--color-uswds-success-dark) bg-white',
              // Disabled state
              disabled &&
                'cursor-not-allowed border border-(--color-uswds-base-ink) bg-(--color-uswds-disabled-medium)',
            )}
          />
        </div>
      );
    };

    export default UswdsTextInput;
