js:
  original: |
    import { cn, Image } from 'drupal-canvas';

    const sizeClass = {
      xs: 'h-8',
      sm: 'h-20',
      md: 'h-40',
      lg: 'h-60',
      full: 'h-full min-h-40',
    };

    const UswdsCardMedia = ({ image, size = 'md' }) => {
      if (!image?.src) return null;

      return (
        <div
          className={cn('usa-card__media w-full overflow-hidden', sizeClass[size] ?? sizeClass.md)}
        >
          <Image
            src={image.src}
            alt={image.alt || ''}
            width={image.width || 640}
            height={image.height || 360}
            className="h-full w-full object-cover"
          />
        </div>
      );
    };

    export default UswdsCardMedia;
