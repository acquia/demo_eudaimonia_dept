js:
  original: |
    import { useState } from 'react';
    import UswdsSearch from '@/components/uswds_search';
    import { cn } from 'drupal-canvas';

    const resolveBgColor = (token) => {
      if (!token) return undefined;
      if (token === 'white') return 'white';
      return `var(--color-uswds-${token})`;
    };

    const TEXT_COLOR_MAP = {
      light: 'white',
      dark: 'var(--color-uswds-base-ink)',
      primary: 'var(--color-uswds-primary-darker)',
      secondary: 'var(--color-eud-gold)',
    };

    const resolveTextColor = (token) => TEXT_COLOR_MAP[token] ?? undefined;

    const UswdsHeader = ({
      topBgColor = '',
      navBgColor = '',
      navTextColor = '',
      logo,
      language_selector,
      nav,
      search = false,
      className = '',
    }) => {
      const [menuOpen, setMenuOpen] = useState(false);

      return (
        <header className={cn('usa-header font-sans', className)}>
          {/* Row 1: logo + language + search */}
          <div
            style={{ backgroundColor: resolveBgColor(topBgColor) }}
            className={cn(!topBgColor && 'bg-white')}
          >
            <div className="mx-auto max-w-[1240px] px-8">
              <div className="flex items-center justify-between py-4">
                <div>{logo}</div>

                <div className="flex items-center gap-4">
                  {language_selector && (
                    <div className="hidden md:block">{language_selector}</div>
                  )}
                  {search && (
                    <div className="hidden md:block">
                      <UswdsSearch placeholder="Search Eudaimonia" />
                    </div>
                  )}

                  {/* Mobile toggle — only shown when there's a nav */}
                  {nav && (
                    <button
                      type="button"
                      className="usa-menu-btn flex h-12 w-12 items-center justify-center text-(--color-uswds-base-ink) focus-visible:outline-2 focus-visible:outline-(--uswds-focus-color) md:hidden"
                      aria-expanded={menuOpen}
                      aria-controls="header-nav"
                      onClick={() => setMenuOpen(!menuOpen)}
                      aria-label={menuOpen ? 'Close menu' : 'Open menu'}
                    >
                      {menuOpen ? (
                        <svg viewBox="0 0 24 24" className="h-6 w-6 fill-current" aria-hidden="true">
                          <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
                        </svg>
                      ) : (
                        <svg viewBox="0 0 24 24" className="h-6 w-6 fill-current" aria-hidden="true">
                          <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
                        </svg>
                      )}
                    </button>
                  )}
                </div>
              </div>
            </div>
          </div>

          {/* Row 2: nav bar — omitted entirely when no nav slot */}
          {nav && (
            <div
              id="header-nav"
              style={{
                backgroundColor: resolveBgColor(navBgColor),
                color: resolveTextColor(navTextColor),
              }}
              className={cn(
                'usa-nav border-t-4 border-(--color-eud-gold)',
                !navBgColor && 'bg-(--color-uswds-primary-darker)',
                !menuOpen && 'hidden md:block',
              )}
            >
              <div className="mx-auto max-w-[1240px] px-8">
                <div className="flex flex-col md:flex-row md:items-center">
                  {nav}
                </div>

                {/* Mobile drawer extras */}
                {menuOpen && (
                  <>
                    {language_selector && (
                      <div className="border-t border-(--color-uswds-primary-dark) py-4 md:hidden">
                        {language_selector}
                      </div>
                    )}
                    {search && (
                      <div className="border-t border-(--color-uswds-primary-dark) py-4 md:hidden">
                        <UswdsSearch size="small" />
                      </div>
                    )}
                  </>
                )}
              </div>
            </div>
          )}
        </header>
      );
    };

    export default UswdsHeader;
