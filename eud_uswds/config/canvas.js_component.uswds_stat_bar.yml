js:
  original: |
    import { Children, cloneElement, isValidElement } from 'react';
    import { cn } from 'drupal-canvas';

    const resolveBgColor = (token) => {
      if (!token) return undefined;
      if (token === 'white') return 'white';
      return `var(--color-uswds-${token})`;
    };

    // Dark backgrounds auto-get light text; light backgrounds get dark text
    const DARK_BG = new Set([
      'primary',
      'primary-dark',
      'primary-darker',
      'base-dark',
      'base-darkest',
    ]);

    const UswdsStatBar = ({
      background = 'primary-darker',
      items,
      className = '',
    }) => {
      const isDark = DARK_BG.has(background);

      const injected = Children.map(items, (child) =>
        isValidElement(child)
          ? cloneElement(child, {
              variant: isDark ? 'default' : 'card',
              textColor: isDark ? 'light' : 'dark',
            })
          : child,
      );

      return (
        <div
          style={{ backgroundColor: resolveBgColor(background) }}
          className={cn(
            'w-full py-12 font-sans',
            !background && 'bg-(--color-uswds-primary-darker)',
            className,
          )}
        >
          <div className="mx-auto grid max-w-[1240px] grid-cols-1 gap-6 px-8 sm:grid-cols-[repeat(auto-fit,minmax(220px,1fr))]">
            {injected}
          </div>
        </div>
      );
    };

    export default UswdsStatBar;
