js:
  original: |
    import { cn } from 'drupal-canvas';

    // USWDS Stat Item
    // variant 'default': gold left border style (use on dark/navy bg → textColor 'light')
    // variant 'card': bordered card style (use on white/gray bg → textColor 'dark')

    const NUMBER_COLOR_MAP = {
      light: 'text-white',
      dark: 'text-(--color-uswds-primary-darker)',
      primary: 'text-(--color-uswds-primary-darker)',
      secondary: 'text-(--color-eud-gold)',
    };

    const LABEL_COLOR_MAP = {
      light: 'text-white/70',
      dark: 'text-(--color-uswds-base-dark)',
      primary: 'text-(--color-uswds-base-dark)',
      secondary: 'text-(--color-uswds-base-dark)',
    };

    const UswdsStatItem = ({
      number = '',
      label = '',
      variant = 'default',
      textColor = 'light',
      className = '',
    }) => {
      const isCard = variant === 'card';

      return (
        <div
          className={cn(
            'font-sans',
            isCard
              ? 'flex flex-col items-center justify-center rounded-sm border border-(--color-uswds-base-lighter) px-6 py-8 text-center'
              : 'border-l-[3px] border-(--color-eud-gold) pl-5',
            className,
          )}
        >
          <p
            className={cn(
              'mb-2 font-serif text-[44px] leading-none font-black',
              NUMBER_COLOR_MAP[textColor] ?? 'text-white',
            )}
          >
            {number}
          </p>
          <p
            className={cn(
              'text-[13px] font-normal tracking-[1px] uppercase',
              LABEL_COLOR_MAP[textColor] ?? 'text-white/70',
            )}
          >
            {label}
          </p>
        </div>
      );
    };

    export default UswdsStatItem;
