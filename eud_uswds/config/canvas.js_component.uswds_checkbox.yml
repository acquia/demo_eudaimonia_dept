js:
  original: |
    import { cn } from 'drupal-canvas';

    const UswdsCheckbox = ({
      label = '',
      name = '',
      value = '',
      description = '',
      checked = false,
      disabled = false,
      tile = false,
      className = '',
    }) => {
      const id = `checkbox-${name}-${value}`;
      const descId = description ? `${id}-desc` : undefined;

      return (
        <div
          className={cn(
            'usa-checkbox flex items-start gap-2 font-sans',
            tile &&
              cn(
                'usa-checkbox--tile rounded border-2 px-4 py-3',
                disabled
                  ? 'border-(--color-uswds-disabled-light)'
                  : 'border-(--color-uswds-disabled) has-[:checked]:border-(--color-uswds-primary) has-[:checked]:bg-(--color-uswds-primary-lighter)',
              ),
            className,
          )}
        >
          <input
            id={id}
            type="checkbox"
            name={name}
            value={value}
            defaultChecked={checked}
            disabled={disabled}
            aria-describedby={descId}
            className="usa-checkbox__input mt-0.5 h-5 w-5 shrink-0 cursor-pointer accent-(--color-uswds-primary) focus-visible:outline-2 focus-visible:outline-offset-(--uswds-focus-offset) focus-visible:outline-(--uswds-focus-color) disabled:cursor-not-allowed"
          />
          <div className="flex flex-col gap-2">
            <label
              htmlFor={id}
              className={cn(
                'usa-checkbox__label cursor-pointer text-base leading-[1.3]',
                disabled
                  ? 'cursor-not-allowed text-(--color-uswds-disabled-medium)'
                  : 'text-(--color-uswds-base-ink)',
              )}
            >
              {label}
            </label>
            {description && (
              <span
                id={descId}
                className={cn(
                  'usa-checkbox__label-description text-[14px] leading-[1.3]',
                  disabled
                    ? 'text-(--color-uswds-disabled-medium)'
                    : 'text-(--color-uswds-base-ink)',
                )}
              >
                {description}
              </span>
            )}
          </div>
        </div>
      );
    };

    export default UswdsCheckbox;
