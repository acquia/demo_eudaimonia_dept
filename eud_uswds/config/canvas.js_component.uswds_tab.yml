js:
  original: |
    import { useEffect, useRef, useState } from 'react';
    import { cn } from 'drupal-canvas';

    const UswdsTab = ({
      items,
      accessibleLabel = 'Page sections',
      className = '',
    }) => {
      const containerRef = useRef(null);
      const [activeTab, setActiveTab] = useState(0);
      const [tabLabels, setTabLabels] = useState([]);

      useEffect(() => {
        const findTabs = () => {
          if (!containerRef.current) return;
          const els = containerRef.current.querySelectorAll('.tab-item-content');
          if (els.length > 0) {
            setTabLabels(
              Array.from(els).map((el) => el.getAttribute('data-tab-label') || ''),
            );
          } else {
            setTimeout(findTabs, 50);
          }
        };
        findTabs();
      }, [items]);

      useEffect(() => {
        if (!containerRef.current) return;
        const els = containerRef.current.querySelectorAll('.tab-item-content');
        els.forEach((el, i) => {
          el.style.display = i === activeTab ? 'block' : 'none';
        });
      }, [activeTab, tabLabels]);

      return (
        <div className={cn('usa-tabs font-sans', className)}>
          <div
            role="tablist"
            aria-label={accessibleLabel}
            className="flex border-b border-(--color-uswds-base-lighter)"
          >
            {tabLabels.map((label, i) => (
              <button
                key={i}
                role="tab"
                type="button"
                id={`tab-${i}`}
                aria-selected={i === activeTab}
                aria-controls={`panel-${i}`}
                onClick={() => setActiveTab(i)}
                className={cn(
                  'flex-1 border-b-[3px] px-2 pt-2.5 pb-2.5 text-sm font-semibold transition-colors focus-visible:outline-2 focus-visible:outline-(--uswds-focus-color)',
                  i === activeTab
                    ? '-mb-px border-(--color-uswds-primary-darker) text-(--color-uswds-primary-darker)'
                    : 'border-transparent text-(--color-uswds-base-dark) hover:text-(--color-uswds-primary-darker)',
                )}
              >
                {label}
              </button>
            ))}
          </div>

          <div ref={containerRef} className="mt-4">
            {items}
          </div>
        </div>
      );
    };

    export default UswdsTab;
