name: '(Eud-Kit) USWDS Search Results'
required: {  }
props:
  headingText:
    type: string
    title: 'Heading text'
    examples:
      - 'Search results'
  noResultsText:
    type: string
    title: 'No results text'
    examples:
      - 'No results found for your search.'
slots: {  }
js:
  original: |
    import { useState } from 'react';
    import useSWR from 'swr';
    import { cn } from 'drupal-canvas';

    const PAGE_SIZE = 10;

    const getQ = () => {
      try {
        return (
          new URLSearchParams(parent.window?.location?.search || '').get('q') || ''
        );
      } catch {
        return '';
      }
    };

    const getBaseUrl = () => {
      try {
        const settings = parent.window?.drupalSettings?.canvasData?.v0;
        return (
          settings?.baseUrl ||
          parent.window?.location?.origin ||
          window.location.origin
        );
      } catch {
        return window.location.origin;
      }
    };

    const getApiPrefix = () => {
      try {
        return (
          parent.window?.drupalSettings?.canvasData?.v0?.jsonapiSettings
            ?.apiPrefix || 'api'
        );
      } catch {
        return 'api';
      }
    };

    const fetcher = async ([query, offset]) => {
      const url = `${getBaseUrl()}/${getApiPrefix()}/index--cms_content?filter[fulltext]=${encodeURIComponent(query)}&page[limit]=${PAGE_SIZE}&page[offset]=${offset}`;
      const res = await fetch(url, { credentials: 'include' });
      if (!res.ok) throw new Error(`${res.status}`);
      return res.json();
    };

    const ChevronLeft = () => (
      <svg
        aria-hidden="true"
        className="mr-1 h-4 w-4"
        viewBox="0 0 16 16"
        fill="none"
      >
        <path
          d="M10 12L6 8l4-4"
          stroke="currentColor"
          strokeLinecap="round"
          strokeLinejoin="round"
        />
      </svg>
    );

    const ChevronRight = () => (
      <svg
        aria-hidden="true"
        className="ml-1 h-4 w-4"
        viewBox="0 0 16 16"
        fill="none"
      >
        <path
          d="M6 12l4-4-4-4"
          stroke="currentColor"
          strokeLinecap="round"
          strokeLinejoin="round"
        />
      </svg>
    );

    const UswdsSearchResults = ({
      headingText = 'Search results',
      noResultsText = 'No results found for your search.',
      className = '',
    }) => {
      const [offset, setOffset] = useState(0);
      const q = getQ();

      const { data, error, isLoading } = useSWR(
        q ? [q, offset] : null,
        fetcher,
      );

      if (!q) {
        return (
          <p className={cn('font-sans text-(--color-uswds-base)', className)}>
            Enter a search term above to see results.
          </p>
        );
      }

      if (isLoading) {
        return (
          <p className={cn('font-sans text-(--color-uswds-base)', className)}>
            Loading…
          </p>
        );
      }

      if (error) {
        return (
          <p
            className={cn(
              'font-sans text-(--color-uswds-secondary-dark)',
              className,
            )}
          >
            Could not load results. Please try again.
          </p>
        );
      }

      const results = data?.data ?? [];
      const total = data?.meta?.count ?? results.length;
      const hasNext = Boolean(data?.links?.next?.href);
      const hasPrev = Boolean(data?.links?.prev?.href);

      return (
        <div className={cn('font-sans', className)}>
          <h2 className="mb-1 text-2xl font-bold text-(--color-uswds-base-ink)">
            {headingText}
          </h2>
          {total > 0 && (
            <p className="mb-4 text-sm text-(--color-uswds-base)">
              {total} result{total !== 1 ? 's' : ''} for{' '}
              <strong>&ldquo;{q}&rdquo;</strong>
            </p>
          )}

          {results.length === 0 ? (
            <p className="text-(--color-uswds-base)">{noResultsText}</p>
          ) : (
            <ul className="m-0 list-none divide-y divide-(--color-uswds-base-lighter) p-0">
              {results.map((item, i) => {
                const title = item.attributes?.title || item.title || '';
                const alias =
                  item.attributes?.path?.alias ||
                  item.path?.alias ||
                  item.attributes?.drupal_internal__nid
                    ? `/node/${item.attributes?.drupal_internal__nid}`
                    : '#';
                return (
                  <li key={i} className="py-3">
                    <a
                      href={alias}
                      className="text-base font-semibold text-(--color-uswds-primary) no-underline hover:underline"
                    >
                      {title}
                    </a>
                  </li>
                );
              })}
            </ul>
          )}

          {(hasPrev || hasNext) && (
            <div className="mt-6 flex gap-2">
              {hasPrev && (
                <button
                  type="button"
                  onClick={() => setOffset(Math.max(0, offset - PAGE_SIZE))}
                  className="flex items-center rounded border border-(--color-uswds-base-lighter) bg-white px-3 py-1.5 text-sm text-(--color-uswds-base) hover:bg-(--color-uswds-base-lightest)"
                >
                  <ChevronLeft />
                  Previous
                </button>
              )}
              {hasNext && (
                <button
                  type="button"
                  onClick={() => setOffset(offset + PAGE_SIZE)}
                  className="flex items-center rounded border border-(--color-uswds-base-lighter) bg-white px-3 py-1.5 text-sm text-(--color-uswds-base) hover:bg-(--color-uswds-base-lightest)"
                >
                  Next
                  <ChevronRight />
                </button>
              )}
            </div>
          )}
        </div>
      );
    };

    export default UswdsSearchResults;
