js:
  original: |
    import UswdsTag from '@/components/uswds_tag';
    import { cn } from 'drupal-canvas';

    // USWDS Event Meta Tags — the three badges shown in the event hero:
    // Format, Category, and Registration status.
    //
    // Format and status arrive as plain scalar strings (the human-readable label of
    // a Drupal list field). Category is bound to the node's `field_categories`
    // entity reference, which is MULTI-VALUE — a content-template expression resolves
    // it to an array of names, not a single string. To keep the hero from throwing
    // on an array value, this component accepts `category` as a string OR an array
    // (of strings or `{name}` term objects) and coerces it to the first category
    // name. This keeps all three badges rendering without a per-instance fetch.

    const resolveCategory = (value: unknown): string => {
      if (!value) return '';
      const first = Array.isArray(value) ? value[0] : value;
      if (first == null) return '';
      if (typeof first === 'string') return first;
      if (typeof first === 'object') {
        const obj = first as Record<string, unknown>;
        return (obj.name as string) ?? (obj.value as string) ?? '';
      }
      return String(first);
    };

    const UswdsEventMetaTags = ({
      format = '',
      category = '',
      status = '',
      className = '',
    }) => {
      const categoryName = resolveCategory(category);

      return (
        <span className={cn('inline-flex flex-wrap items-center gap-2', className)}>
          {format && <UswdsTag text={format} variant="cool" size="big" />}
          {categoryName && (
            <UswdsTag text={categoryName} variant="neutral" size="big" />
          )}
          {status && <UswdsTag text={status} variant="informative" size="big" />}
        </span>
      );
    };

    export default UswdsEventMetaTags;
