js:
  original: |
    import { useState } from 'react';
    import UswdsLabel from '@/components/uswds_label';
    import { cn } from 'drupal-canvas';

    const UswdsFileInput = ({
      label = '',
      name = '',
      accept = '',
      multiple = false,
      hint = '',
      error = '',
      className = '',
    }) => {
      const id = `file-${name}`;
      const dragText = multiple ? 'Drag files here or ' : 'Drag file here or ';
      const [selectedFiles, setSelectedFiles] = useState([]);

      const handleChange = (e) => {
        setSelectedFiles(Array.from(e.target.files || []));
      };

      const handleClear = () => {
        setSelectedFiles([]);
      };

      const hasFiles = selectedFiles.length > 0;

      return (
        <div className={cn('usa-file-input flex flex-col gap-1 font-sans', className)}>
          {label && <UswdsLabel labelText={label} htmlFor={id} hintText={hint} />}
          {error && (
            <span className="text-sm font-bold text-(--color-uswds-error)">
              {error}
            </span>
          )}

          {/* Preview state: shown after file(s) selected */}
          {hasFiles ? (
            <div className="border border-dashed border-(--color-uswds-base-light) bg-(--color-uswds-primary-lighter)">
              {/* Header row */}
              <div className="flex items-center justify-between px-2 py-1 text-sm">
                <span className="font-bold text-(--color-uswds-base-ink)">
                  Selected file{selectedFiles.length > 1 ? 's' : ''}
                </span>
                <button
                  type="button"
                  onClick={handleClear}
                  className="text-(--color-uswds-primary) underline focus-visible:outline-2 focus-visible:outline-(--uswds-focus-color)"
                >
                  Change file{selectedFiles.length > 1 ? 's' : ''}
                </button>
              </div>
              {/* File list */}
              <div className="border-t border-white">
                {selectedFiles.map((file, i) => (
                  <div key={i} className="flex items-center gap-2 px-2 py-1">
                    <div className="flex h-10 w-10 flex-shrink-0 items-center justify-center bg-(--color-uswds-base-ink)">
                      <svg
                        viewBox="0 0 24 24"
                        className="h-5 w-5 fill-white"
                        aria-hidden="true"
                      >
                        <path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z" />
                      </svg>
                    </div>
                    <span className="text-xs text-(--color-uswds-base-ink)">
                      {file.name}
                    </span>
                  </div>
                ))}
              </div>
              {/* Hidden input for re-selection */}
              <input
                id={id}
                type="file"
                name={name}
                accept={accept}
                multiple={multiple}
                onChange={handleChange}
                className="sr-only"
              />
            </div>
          ) : (
            /* Drop zone */
            <div
              className={cn(
                'relative border border-dashed border-(--color-uswds-base-light) bg-white px-4 py-8',
                error && 'border-2 border-(--color-uswds-error)',
              )}
            >
              <label
                htmlFor={id}
                className="flex cursor-pointer items-center justify-center text-center text-sm text-(--color-uswds-base-ink)"
              >
                <span>
                  {dragText}
                  <span className="text-(--color-uswds-primary) underline">
                    choose from folder
                  </span>
                </span>
              </label>
              <input
                id={id}
                type="file"
                name={name}
                accept={accept}
                multiple={multiple}
                onChange={handleChange}
                className="absolute inset-0 h-full w-full cursor-pointer opacity-0"
              />
            </div>
          )}
        </div>
      );
    };

    export default UswdsFileInput;
