  original: |
    import { cn } from 'drupal-canvas';

    const IconSearch = ({ className = 'h-6 w-6' }) => (
      <svg
        aria-hidden="true"
        focusable="false"
        className={className}
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="currentColor"
      >
        <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" />
      </svg>
    );

    const focusStyles =
      'focus-visible:outline-2 focus-visible:outline-(--uswds-focus-color) focus-visible:outline-offset-(--uswds-focus-offset)';

    const UswdsSearch = ({
      size = 'default',
      placeholder = '',
      searchPageUrl = '/search',
      className = '',
    }) => {
      const isLarge = size === 'large';
      const isSmall = size === 'small';

      // Pre-fill with the current ?q= value when already on the search page
      const q =
        typeof parent !== 'undefined'
          ? new URLSearchParams(parent.window?.location?.search || '').get('q') ||
            ''
          : '';

      return (
        <form
          role="search"
          action={searchPageUrl}
          method="get"
          className={cn(
            'usa-search flex h-10 overflow-hidden rounded border-2 border-(--color-uswds-primary-darker) font-sans',
            isLarge && 'h-12',
            className,
          )}
        >
          <label htmlFor="search-field" className="sr-only">
            Search
          </label>
          <input
            id="search-field"
            type="search"
            name="q"
            defaultValue={q}
            placeholder={placeholder}
            className={cn(
              'usa-search__input flex-1 border-0 bg-white px-3 text-(--color-uswds-base-ink) outline-none',
              'focus:ring-2 focus:ring-(--uswds-focus-color) focus:ring-inset',
              isLarge ? 'text-lg' : 'text-base',
            )}
          />
          <button
            type="submit"
            className={cn(
              'usa-search__submit-button flex items-center justify-center bg-(--color-uswds-primary-darker) font-semibold text-white transition-opacity',
              'hover:opacity-80',
              focusStyles,
              isLarge
                ? 'px-6 text-[length:var(--font-size-uswds-lg,1.375rem)]'
                : 'px-4 text-sm',
            )}
            aria-label={isSmall ? 'Search' : undefined}
          >
            {isSmall ? <IconSearch className="h-5 w-5" /> : <span>Search</span>}
          </button>
        </form>
      );
    };

    export default UswdsSearch;
