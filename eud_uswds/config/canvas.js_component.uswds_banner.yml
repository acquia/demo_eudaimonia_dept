js:
  original: |
    import { Children, cloneElement, isValidElement, useState } from 'react';
    import { cn, Image } from 'drupal-canvas';

    const ExpandIcon = ({ open }) => (
      <svg
        aria-hidden="true"
        focusable="false"
        className={cn(
          'ml-0.5 inline-block h-4 w-4 shrink-0 transition-transform',
          open && 'rotate-180',
        )}
        viewBox="0 0 24 24"
        fill="currentColor"
      >
        <path d="M16.59 8.59L12 13.17 7.41 8.59 6 10l6 6 6-6-1.41-1.41z" />
      </svg>
    );

    const CloseIcon = () => (
      <svg
        aria-hidden="true"
        focusable="false"
        className="h-6 w-6"
        viewBox="0 0 24 24"
        fill="currentColor"
      >
        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
      </svg>
    );

    const UswdsBanner = ({
      background = 'light',
      headerText = 'An official website of the United States government',
      triggerText = "Here's how you know",
      expanded: defaultExpanded = false,
      headerIcon,
      details,
    }) => {
      const [expanded, setExpanded] = useState(defaultExpanded);
      const isDark = background === 'dark';

      // Inject background into each detail item so text colours adapt
      const injectedDetails = Children.map(details, (child) =>
        isValidElement(child) ? cloneElement(child, { background }) : child,
      );

      return (
        <section
          className={cn(
            'usa-banner font-sans text-xs',
            isDark
              ? 'bg-(--color-uswds-base-darkest) text-white'
              : 'bg-(--color-uswds-base-lightest) text-(--color-uswds-base-ink)',
          )}
          aria-label={headerText}
        >
          <div className="mx-auto max-w-[1240px]">
            {/* Banner bar */}
            <div className="flex items-start">
              <div className="flex flex-1 flex-wrap items-center gap-x-2 gap-y-0.5 px-4 py-1">
                {headerIcon?.src && (
                  <div className="flex h-[11px] w-4 shrink-0 items-center overflow-hidden">
                    <Image
                      src={headerIcon.src}
                      alt={headerIcon.alt || ''}
                      width={headerIcon.width || 16}
                      height={headerIcon.height || 11}
                      className="h-full w-auto object-contain"
                    />
                  </div>
                )}
                <p className="m-0 leading-none">{headerText}</p>
                <button
                  type="button"
                  className={cn(
                    'usa-banner__button flex cursor-pointer items-center border-0 bg-transparent p-0 text-xs leading-none underline focus-visible:outline-2 focus-visible:outline-offset-0 focus-visible:outline-(--uswds-focus-color)',
                    isDark
                      ? 'text-(--color-uswds-primary-light)'
                      : 'text-(--color-uswds-primary)',
                  )}
                  onClick={() => setExpanded(!expanded)}
                  aria-expanded={expanded}
                >
                  {triggerText}
                  <ExpandIcon open={expanded} />
                </button>
              </div>

              {/* Mobile-only close button */}
              {expanded && (
                <button
                  type="button"
                  aria-label="Close"
                  className={cn(
                    'flex h-12 w-12 shrink-0 items-center justify-center focus-visible:outline-2 focus-visible:outline-(--uswds-focus-color) md:hidden',
                    isDark
                      ? 'bg-(--color-uswds-base-darker)'
                      : 'bg-(--color-uswds-base-lighter)',
                  )}
                  onClick={() => setExpanded(false)}
                >
                  <CloseIcon />
                </button>
              )}
            </div>

            {/* Expanded detail panel — flexible number of items in a responsive grid */}
            {expanded && injectedDetails?.length > 0 && (
              <div className="usa-banner__content grid grid-cols-1 gap-4 px-3 py-4 md:grid-cols-2">
                {injectedDetails}
              </div>
            )}
          </div>
        </section>
      );
    };

    export default UswdsBanner;
