js:
  original: |
    import { cn } from 'drupal-canvas';

    const resolveColor = (token) => {
      if (!token) return undefined;
      if (token === 'white') return 'white';
      return `var(--color-uswds-${token})`;
    };

    const UswdsFooter = ({
      topRowBackgroundColor = 'primary-darker',
      bottomRowBackgroundColor = 'primary-dark',
      logo,
      topNav,
      cta,
      bottomNav,
      className = '',
    }) => {
      return (
        <footer className={cn('usa-footer font-sans', className)}>
          {/* Top row: logo + primary nav + cta */}
          <div className="usa-footer__primary-section" style={{ backgroundColor: resolveColor(topRowBackgroundColor) }}>
            <div className="mx-auto flex max-w-[1240px] flex-wrap items-center justify-between gap-6 px-8 py-8">
              {logo && <div className="shrink-0">{logo}</div>}
              {topNav && (
                <nav
                  aria-label="Footer primary navigation"
                  className="usa-footer__nav min-w-[200px] flex-1"
                >
                  {topNav}
                </nav>
              )}
              {cta && <div className="shrink-0">{cta}</div>}
            </div>
          </div>

          {/* Bottom row: secondary nav */}
          <div className="usa-footer__secondary-section" style={{ backgroundColor: resolveColor(bottomRowBackgroundColor) }}>
            <div className="mx-auto flex max-w-[1240px] flex-wrap items-center px-8 py-6">
              {bottomNav && (
                <nav aria-label="Footer secondary navigation" className="usa-footer__nav">{bottomNav}</nav>
              )}
            </div>
          </div>
        </footer>
      );
    };

    export default UswdsFooter;
