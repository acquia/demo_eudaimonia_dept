langcode: en
status: true
dependencies:
  enforced:
    module:
      - canvas
id: global
label: 'Global CSS'
css:
  original: |
    /*
     * Ensure your theme imports the font you're using in this file.
     * Alternatively, you can load fonts purely in Code Components by importing a
     * CSS file with the font declarations from a URL, i.e. a CDN. For example, you
     * can uncomment the following line to use the Inter font.
     * For local development, Workbench loads the global CSS file configured in
     * canvas.config.json.
     */
    /* @import url("https://rsms.me/inter/inter.css"); */
    @import url('https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,100;0,300;0,400;0,600;0,700;0,900;1,400&family=Merriweather:wght@300;400;700&family=Source+Code+Pro&display=swap');

    @import 'tailwindcss';

    @theme {
      /* ─── Tailwind palette overrides (needed for built-in Tailwind utilities) ── */
      --font-sans: 'Public Sans', system-ui, sans-serif;
      --font-serif: 'Merriweather', Georgia, serif;
      --font-mono: 'Source Code Pro', monospace;

      --color-primary-100: var(--color-blue-100);
      --color-primary-200: var(--color-blue-200);
      --color-primary-300: var(--color-blue-300);
      --color-primary-400: var(--color-blue-400);
      --color-primary-500: var(--color-blue-500);
      --color-primary-600: var(--color-blue-600);
      --color-primary-700: var(--color-blue-700);
      --color-primary-800: var(--color-blue-800);
      --color-primary-900: var(--color-blue-900);

      --color-primary-dark: var(--color-primary-700);
      --color-primary-light: var(--color-slate-400);

      --color-gray-50: var(--color-slate-50);
      --color-gray-100: var(--color-slate-100);
      --color-gray-200: var(--color-slate-200);
      --color-gray-300: var(--color-slate-300);
      --color-gray-400: var(--color-slate-400);
      --color-gray-500: var(--color-slate-500);
      --color-gray-600: var(--color-slate-600);
      --color-gray-700: var(--color-slate-700);
      --color-gray-800: var(--color-slate-800);
      --color-gray-900: var(--color-slate-900);

      --color-gray-dark: var(--color-gray-700);
      --color-gray-light: var(--color-gray-300);

      --color-white: #ffffff;
      --color-black: var(--color-slate-950);
    }

    /* ─── USWDS CSS Custom Properties ────────────────────────────────────────────
     * Defined as plain :root properties so var() references in components
     * always resolve correctly regardless of how Tailwind processes @theme.
     */
    :root {
      /* ─── TYPOGRAPHY: Font Families ─────────────────────────────────────────── */
      --font-uswds: 'Public Sans', sans-serif;
      --font-uswds-serif: 'Merriweather', serif;
      --font-uswds-mono: 'Source Code Pro', monospace;

      --font-uswds-heading: var(--font-uswds);
      --font-uswds-body: var(--font-uswds);
      --font-uswds-ui: var(--font-uswds);
      --font-uswds-code: var(--font-uswds-mono);

      /* ─── TYPOGRAPHY: Theme Font Sizes (3xs – 3xl) ──────────────────────────── */
      --font-size-uswds-3xs: 0.8125rem; /* 13px */
      --font-size-uswds-2xs: 0.875rem; /* 14px */
      --font-size-uswds-xs: 0.9375rem; /* 15px */
      --font-size-uswds-sm: 1rem; /* 16px */
      --font-size-uswds-md: 1.0625rem; /* 17px */
      --font-size-uswds-lg: 1.375rem; /* 22px */
      --font-size-uswds-xl: 2rem; /* 32px */
      --font-size-uswds-2xl: 3rem; /* 48px */
      --font-size-uswds-3xl: 4rem; /* 64px */

      /* ─── TYPOGRAPHY: System Font Sizes (micro + 1–20) ─────────────────────── */
      --font-size-uswds-micro: 0.625rem;
      --font-size-uswds-1: 0.75rem;
      --font-size-uswds-2: 0.8125rem;
      --font-size-uswds-3: 0.875rem;
      --font-size-uswds-4: 0.9375rem;
      --font-size-uswds-5: 1rem;
      --font-size-uswds-6: 1.0625rem;
      --font-size-uswds-7: 1.125rem;
      --font-size-uswds-8: 1.25rem;
      --font-size-uswds-9: 1.375rem;
      --font-size-uswds-10: 1.5rem;
      --font-size-uswds-11: 1.75rem;
      --font-size-uswds-12: 2rem;
      --font-size-uswds-13: 2.25rem;
      --font-size-uswds-14: 2.5rem;
      --font-size-uswds-15: 3rem;
      --font-size-uswds-16: 3.5rem;
      --font-size-uswds-17: 4rem;
      --font-size-uswds-18: 5rem;
      --font-size-uswds-19: 7.5rem;
      --font-size-uswds-20: 8.75rem;

      /* ─── TYPOGRAPHY: Font Weights ──────────────────────────────────────────── */
      --font-weight-uswds-thin: 100;
      --font-weight-uswds-light: 300;
      --font-weight-uswds-normal: 400;
      --font-weight-uswds-semibold: 600;
      --font-weight-uswds-bold: 700;
      --font-weight-uswds-heavy: 900;

      /* ─── COLOR: Primary (blue) ─────────────────────────────────────────────── */
      --color-uswds-primary-lightest: #eff6fb;
      --color-uswds-primary-lighter: #d9e8f6;
      --color-uswds-primary-light: #73b3e7;
      --color-uswds-primary: #005ea2;
      --color-uswds-primary-dark: #1a4480;
      --color-uswds-primary-darker: #162e51;

      /* ─── COLOR: Secondary (red) ────────────────────────────────────────────── */
      --color-uswds-secondary-lightest: #fff3f2;
      --color-uswds-secondary-lighter: #f8dfe2;
      --color-uswds-secondary-light: #f2938c;
      --color-uswds-secondary: #d83933;
      --color-uswds-secondary-dark: #b50909;
      --color-uswds-secondary-darker: #c60000;
      --color-uswds-secondary-darkest: #8b0a03;

      /* ─── COLOR: Accent Cool (cyan) ─────────────────────────────────────────── */
      --color-uswds-accent-cool-lightest: #e7f6f8;
      --color-uswds-accent-cool-lighter: #99deea;
      --color-uswds-accent-cool-light: #21c6e1;
      --color-uswds-accent-cool: #00bde3;
      --color-uswds-accent-cool-dark: #009ec1;
      --color-uswds-accent-cool-darker: #07648d;

      /* ─── COLOR: Accent Warm (orange) ───────────────────────────────────────── */
      --color-uswds-accent-warm-lightest: #fce2b4;
      --color-uswds-accent-warm-lighter: #ffbc78;
      --color-uswds-accent-warm-light: #fa9441;
      --color-uswds-accent-warm: #c05600;
      --color-uswds-accent-warm-dark: #8f3a00;
      --color-uswds-accent-warm-darker: #775540;

      /* ─── COLOR: Base (gray-cool) ───────────────────────────────────────────── */
      --color-uswds-base-lightest: #f0f0f0;
      --color-uswds-base-lighter: #dfe1e2;
      --color-uswds-base-light: #a9aeb1;
      --color-uswds-base: #71767a;
      --color-uswds-base-dark: #565c65;
      --color-uswds-base-darker: #3d4551;
      --color-uswds-base-darkest: #1b1b1b;
      --color-uswds-base-ink: #1b1b1b;

      /* ─── COLOR: Special ────────────────────────────────────────────────────── */
      --color-uswds-ink: #1b1b1b;
      --color-uswds-ink-reverse: #ffffff;
      --color-uswds-page: #ffffff;

      /* ─── COLOR: Info (cyan) ────────────────────────────────────────────────── */
      --color-uswds-info-lightest: #e7f6f8;
      --color-uswds-info-lighter: #99deea;
      --color-uswds-info-light: #5dbbcc;
      --color-uswds-info: #00bde3;
      --color-uswds-info-dark: #2055a5;

      /* ─── COLOR: Success (green-cool) ───────────────────────────────────────── */
      --color-uswds-success-lightest: #ecf3ec;
      --color-uswds-success-lighter: #b4d8b4;
      --color-uswds-success-light: #4aa564;
      --color-uswds-success: #00a91c;
      --color-uswds-success-dark: #008817;

      /* ─── COLOR: Warning (gold/yellow) ─────────────────────────────────────── */
      --color-uswds-warning-lightest: #faf3d1;
      --color-uswds-warning-lighter: #fce83a;
      --color-uswds-warning-light: #face00;
      --color-uswds-warning: #ffbe2e;
      --color-uswds-warning-dark: #e5a000;

      /* ─── COLOR: Error (red-warm) ───────────────────────────────────────────── */
      --color-uswds-error-lightest: #f4e3db;
      --color-uswds-error-lighter: #f39268;
      --color-uswds-error-light: #d54309;
      --color-uswds-error: #d54309;
      --color-uswds-error-dark: #b50909;

      /* ─── COLOR: Emergency ──────────────────────────────────────────────────── */
      --color-uswds-emergency: #9c3d10;
      --color-uswds-emergency-dark: #332d29;

      /* ─── COLOR: Disabled ───────────────────────────────────────────────────── */
      --color-uswds-disabled-light: #e6e6e6;
      --color-uswds-disabled: #c9c9c9;
      --color-uswds-disabled-dark: #adadad;
      --color-uswds-disabled-medium: #757575;

      /* ─── USWDS Focus ───────────────────────────────────────────────────────── */
      --uswds-focus-color: #2491ff;
      --uswds-focus-offset: 0.25rem;

      /* ─── Eudaimonia theme accent ────────────────────────────────────────────
       * Brand gold used for nav borders, hero accents, gold CTAs, and stat bars.
       * Add these tokens to any project that adopts the Eudaimonia visual theme.
       * ────────────────────────────────────────────────────────────────────── */
      --color-eud-gold: #dec69a;
      --color-eud-gold-dark: #c9a76a;

      /* ─── Spacing (base unit = 8px) ─────────────────────────────────────────── */
      --spacing-uswds-1: 0.5rem;
      --spacing-uswds-105: 0.75rem;
      --spacing-uswds-2: 1rem;
      --spacing-uswds-205: 1.25rem;
      --spacing-uswds-3: 1.5rem;
      --spacing-uswds-4: 2rem;
      --spacing-uswds-5: 2.5rem;
      --spacing-uswds-6: 3rem;
    }

    html {
      @apply text-slate-950;
    }

    /* ═══════════════════════════════════════════════════════════════════════════
       REBRANDING OVERRIDES
       ═══════════════════════════════════════════════════════════════════════════
       The tokens defined above are the USWDS defaults used by every component.
       To rebrand the site, uncomment one colour block below (Section B) and
       optionally a font block (Section A).  The normal CSS cascade means the
       last :root block wins — no component files need to be touched.

       QUICK START
         1. Uncomment ONE colour block in Section B  (change 8 hex values)
         2. Optionally uncomment Section A and swap the font names
         3. Save — every component updates automatically
       ─────────────────────────────────────────────────────────────────────────── */

    /* ── SECTION A — FONTS (optional) ──────────────────────────────────────────
       Step 1: Replace the Google Fonts @import URL at the very top of this file.
       Step 2: Uncomment the block below and update the three font-family values.

    :root {
      --font-uswds:         'Your Font', system-ui, sans-serif;
      --font-uswds-heading: 'Your Font', system-ui, sans-serif;
      --font-uswds-body:    'Your Font', system-ui, sans-serif;
      --font-uswds-ui:      'Your Font', system-ui, sans-serif;
      --font-uswds-serif:   'Your Serif Font', Georgia, serif;
      --font-uswds-mono:    'Your Mono Font', monospace;
      --font-uswds-code:    'Your Mono Font', monospace;
    }
    */

    /* ── SECTION B — PRIMARY COLOUR RAMP ───────────────────────────────────────
       Each block below is a complete ramp (primary 6-step + accent 2-step +
       secondary override).  Uncomment exactly ONE block.

       Contrast requirement: --color-uswds-primary (buttons & links) must be
       at least 4.5 : 1 against white.
       Checker → https://webaim.org/resources/contrastchecker/

       TIP — heading & body fonts use Merriweather (serif) via the Tailwind
       @theme --font-serif token.  To swap heading fonts update that variable
       in the @theme block above AND Section A.
       ─────────────────────────────────────────────────────────────────────────── */

    /* — Federal Blue (USWDS default — already active; shown here for reference) ─
    :root {
      --color-uswds-primary-lightest: #eff6fb;
      --color-uswds-primary-lighter:  #d9e8f6;
      --color-uswds-primary-light:    #73b3e7;
      --color-uswds-primary:          #005ea2;
      --color-uswds-primary-dark:     #1a4480;
      --color-uswds-primary-darker:   #162e51;
      --color-eud-gold:               #dec69a;
      --color-eud-gold-dark:          #c9a76a;
      --color-uswds-secondary:        #d83933;
    }
    */

    /* — Forest / Environment green ─────────────────────────────────────────────
    :root {
      --color-uswds-primary-lightest: #f0f7f0;
      --color-uswds-primary-lighter:  #c5e3c5;
      --color-uswds-primary-light:    #6bb46b;
      --color-uswds-primary:          #2e7d32;
      --color-uswds-primary-dark:     #1b5e20;
      --color-uswds-primary-darker:   #0d3b10;
      --color-eud-gold:               #f9a825;
      --color-eud-gold-dark:          #e65100;
      --color-uswds-secondary:        #b5441a;
    }
    */

    /* — Healthcare / Civic purple ──────────────────────────────────────────────
    :root {
      --color-uswds-primary-lightest: #f5f0ff;
      --color-uswds-primary-lighter:  #d4b8f5;
      --color-uswds-primary-light:    #9b6dd9;
      --color-uswds-primary:          #6b21a8;
      --color-uswds-primary-dark:     #4c1280;
      --color-uswds-primary-darker:   #2e0a4e;
      --color-eud-gold:               #fbbf24;
      --color-eud-gold-dark:          #d97706;
      --color-uswds-secondary:        #be185d;
    }
    */

    /* — Infrastructure / Transport teal ────────────────────────────────────────
    :root {
      --color-uswds-primary-lightest: #e6f7f8;
      --color-uswds-primary-lighter:  #a8dde3;
      --color-uswds-primary-light:    #4db6c4;
      --color-uswds-primary:          #007c91;
      --color-uswds-primary-dark:     #00586a;
      --color-uswds-primary-darker:   #003642;
      --color-eud-gold:               #f4a923;
      --color-eud-gold-dark:          #d4860a;
      --color-uswds-secondary:        #9e3a26;
    }
    */

    /* — Justice / Law enforcement slate ────────────────────────────────────────
    :root {
      --color-uswds-primary-lightest: #f0f1f5;
      --color-uswds-primary-lighter:  #c8ccd8;
      --color-uswds-primary-light:    #7b84a3;
      --color-uswds-primary:          #3a4268;
      --color-uswds-primary-dark:     #252c4e;
      --color-uswds-primary-darker:   #141831;
      --color-eud-gold:               #e8b84b;
      --color-eud-gold-dark:          #c8922a;
      --color-uswds-secondary:        #7b2d2d;
    }
    */
