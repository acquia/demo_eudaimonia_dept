js:
  original: |
    import { cn } from 'drupal-canvas';

    // uswds_icon_image
    // Renders an uploaded image at icon size, intended for use in uswds_card's icon slot.
    // Pass showIconTile={true} to render the 48×48 themed tile background around the image.
    // The tile background automatically follows --color-uswds-primary-lighter so it adapts
    // to any theme ramp change in global.css.
    //
    // Uses a plain <img> tag (not the drupal-canvas Image component).
    // Tile uses flex (not grid) for centering — <img> is a CSS replaced element and
    // justify-items:center in grid is less reliable for replaced content than flexbox.
    //
    // For fully themeable icons (SVG that inherits text color), use uswds_icon instead.

    const UswdsIconImage = ({
      iconImage,
      size = 'md',
      showIconTile = false,
      className = '',
    }) => {
      if (!iconImage?.src) return null;

      const sizeClass = {
        sm: 'h-4 w-4',   // 16px — matches uswds_icon size:sm
        md: 'h-6 w-6',   // 24px — matches uswds_icon size:md (default, fits 48×48 tile)
        lg: 'h-8 w-8',   // 32px — larger icon in tile
      };

      const img = (
        <img
          src={iconImage.src}
          alt={iconImage.alt || ''}
          width={iconImage.width || 24}
          height={iconImage.height || 24}
          className={cn(
            'object-contain',
            sizeClass[size] ?? sizeClass.md,
            className,
          )}
        />
      );

      if (showIconTile) {
        return (
          <div
            className="usa-card__icon self-start flex h-12 w-12 shrink-0 items-center justify-center rounded bg-(--color-uswds-primary-lighter)"
            aria-hidden="true"
          >
            {img}
          </div>
        );
      }

      return img;
    };

    export default UswdsIconImage;
