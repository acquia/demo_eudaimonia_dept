js:
  original: |
    import { Children, cloneElement, isValidElement } from 'react';
    import { cn } from 'drupal-canvas';

    const UswdsCollection = ({
      heading = '',
      spacing = 'default',
      items,
      className = '',
    }) => {
      const styledItems = Children.map(items, (child) =>
        isValidElement(child) ? cloneElement(child, { spacing }) : child,
      );

      return (
        <section className={cn('usa-collection font-sans', className)}>
          {heading && (
            <h2 className="mb-4 font-serif text-[22px] leading-tight font-bold text-(--color-uswds-primary-darker)">
              {heading}
            </h2>
          )}
          <ul className="usa-collection__list m-0 list-none p-0">{styledItems}</ul>
        </section>
      );
    };

    export default UswdsCollection;
