js:
  original: |
    import UswdsLabel from '@/components/uswds_label';
    import { cn } from 'drupal-canvas';

    const UswdsSelect = ({
      label = '',
      name = '',
      options = [],
      hint = '',
      error = '',
      required = false,
      disabled = false,
      className = '',
    }) => {
      const id = `select-${name}`;
      return (
        <div className={cn('usa-form-group flex flex-col gap-1 font-sans', className)}>
          {label && (
            <UswdsLabel
              labelText={label}
              htmlFor={id}
              required={required}
              hintText={hint}
            />
          )}
          {error && (
            <span className="usa-error-message text-sm font-bold text-(--color-uswds-error)">
              {error}
            </span>
          )}
          <select
            id={id}
            name={name}
            required={required}
            disabled={disabled}
            className={cn(
              'usa-select w-full border border-(--color-uswds-base-ink) bg-white px-2 py-2 font-sans text-base text-(--color-uswds-base-ink)',
              'focus:ring-2 focus:ring-(--uswds-focus-color) focus:outline-none',
              error && 'border-l-4 border-(--color-uswds-error)',
              disabled &&
                'cursor-not-allowed bg-(--color-uswds-disabled-medium) text-(--color-uswds-base-ink) opacity-100',
            )}
          >
            <option value="">- Select -</option>
            {options.map((opt, i) => (
              <option key={i} value={opt.value ?? opt}>
                {opt.label ?? opt}
              </option>
            ))}
          </select>
        </div>
      );
    };

    export default UswdsSelect;
