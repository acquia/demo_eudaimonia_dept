js:
  original: |
    import { cn } from 'drupal-canvas';

    const UswdsRadio = ({
      label = '',
      name = '',
      value = '',
      hint = '',
      tile = false,
      disabled = false,
      className = '',
    }) => {
      const id = `radio-${name}-${value}`;
      return (
        <div
          className={cn(
            'usa-radio font-sans',
            tile
              ? cn(
                  'usa-radio--tile rounded border-2 border-(--color-uswds-disabled) bg-white px-4 py-3',
                  'has-[:checked]:border-(--color-uswds-primary) has-[:checked]:bg-(--color-uswds-primary-lighter)',
                  disabled &&
                    'border-(--color-uswds-disabled) bg-white opacity-100',
                )
              : 'pt-3',
            className,
          )}
        >
          <div className="flex items-start gap-2">
            <input
              id={id}
              type="radio"
              name={name}
              value={value}
              disabled={disabled}
              className={cn(
                'usa-radio__input mt-0.5 h-5 w-5 flex-shrink-0 cursor-pointer accent-(--color-uswds-primary)',
                'focus-visible:outline-2 focus-visible:outline-offset-(--uswds-focus-offset) focus-visible:outline-(--uswds-focus-color)',
                disabled && 'cursor-not-allowed opacity-60',
              )}
            />
            <div className="flex flex-col gap-1">
              <label
                htmlFor={id}
                className={cn(
                  'usa-radio__label cursor-pointer text-base leading-[1.3] text-(--color-uswds-base-ink)',
                  disabled &&
                    'cursor-not-allowed text-(--color-uswds-disabled-medium)',
                )}
              >
                {label}
              </label>
              {hint && (
                <span
                  className={cn(
                    'text-sm leading-[1.3] text-(--color-uswds-base-ink)',
                    disabled && 'text-(--color-uswds-disabled-medium)',
                  )}
                >
                  {hint}
                </span>
              )}
            </div>
          </div>
        </div>
      );
    };

    export default UswdsRadio;
