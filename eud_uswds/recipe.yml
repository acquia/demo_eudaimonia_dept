name: 'Eudaimonia USWDS'
type: Recipe
description: 'USWDS (U.S. Web Design System) Canvas JS code component library, page template, and demo content (pages, menus, taxonomy).'
recipes:
  - eud_common
  - eud_canvas
  - eud_acquia_dam
  # Event CT + fields must exist before the event detail content template
  # (canvas.content_template.node.event.full) and the event Canvas pages import.
  - eud_event
config:
  strict: false
  actions:
    # The page template this recipe ships (config/canvas.page_variant.theme_canvas_stark.yml).
    # demo_cms builds sites from recipes, not `config:import`, so this cannot be a
    # shipped canvas.settings.yml - RecipeConfigInstaller skips config that already
    # exists, and eud_canvas has installed canvas by the time this runs.
    canvas.settings:
      simple_config_update:
        default_page_variant: theme_canvas_stark
    # canvas_page is a bundle-less entity, so core's addNodeTypes cannot moderate
    # it; the bundled module's action adds it to the editorial workflow before
    # this recipe's canvas_page content (which carries a moderation_state) imports.
    workflows.workflow.editorial:
      addModerationEntityTypes:
        canvas_page:
          - canvas_page
