name: 'Eudaimonia Article'
type: Recipe
description: 'Article content type + demo articles for the Department of Eudaimonia site template.'
recipes:
  - eud_common
  - eud_person
  # Ships the image media type used by this recipe's demo article media.
  - eud_media
  # Ships the tags terms these articles reference (must apply first).
  - eud_tags
install:
  - node
config:
  strict: false
  actions:
    workflows.workflow.editorial:
      addNodeTypes:
        - article
