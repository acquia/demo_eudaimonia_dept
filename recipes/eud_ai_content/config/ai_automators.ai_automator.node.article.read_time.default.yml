entity_type: node
bundle: article
field_name: read_time
edit_mode: false
base_field: body
prompt: |-
  Based on the context text, calculate the estimated reading time for an average adult. Assume an average reading speed of 250 words per minute.

  Constraints:
  - Format the output exactly as the number followed by the word "minutes" (for example: "6 minutes").
  - If the estimated time is 1 minute or less, output exactly "1 minute".
  - Output ONLY the formatted time. Do not include any other words, explanations, introductory text, or quotation marks.

  Context:
  {{ context }}
token: ''
