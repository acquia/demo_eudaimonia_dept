js:
  original: |
    import { cn } from 'drupal-canvas';

    const UswdsInPageNavigation = ({
      heading = 'On this page',
      items = [],
      className = '',
    }) => {
      return (
        <nav
          aria-label={heading}
          className={cn(
            'usa-in-page-nav flex flex-col gap-4 rounded-lg bg-white p-4 font-sans',
            className,
          )}
        >
          <h4 className="text-[length:--font-size-uswds-2xs] leading-snug font-bold text-(--color-uswds-base-darkest)">
            {heading}
          </h4>
          <div className="flex flex-col">
            {items.map((item, i) => {
              const isCurrent = item.current === true;
              const isSubsection = item.level === 'subsection';
              return (
                <div
                  key={i}
                  className={cn(
                    'border-l border-solid',
                    isCurrent
                      ? 'border-l-[4px] border-(--color-uswds-base-darkest)'
                      : 'border-(--color-uswds-base-lighter)',
                  )}
                >
                  <a
                    href={item.href}
                    aria-current={isCurrent ? 'true' : undefined}
                    className={cn(
                      'block px-4 py-2 text-[length:--font-size-uswds-3xs] leading-normal transition-colors focus-visible:outline-2 focus-visible:outline-offset-(--uswds-focus-offset) focus-visible:outline-(--uswds-focus-color)',
                      isCurrent
                        ? 'font-bold text-(--color-uswds-base-ink)'
                        : cn(
                            'text-(--color-uswds-primary) hover:text-(--color-uswds-primary-dark)',
                            isSubsection ? 'font-normal' : 'font-bold',
                          ),
                    )}
                  >
                    {item.text}
                  </a>
                </div>
              );
            })}
          </div>
        </nav>
      );
    };

    export default UswdsInPageNavigation;
