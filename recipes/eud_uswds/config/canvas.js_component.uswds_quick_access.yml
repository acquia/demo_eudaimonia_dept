        >
          <p className="mb-1 text-lg font-extrabold tracking-[.5px] text-(--color-uswds-primary-darker) uppercase">
            {title}
          </p>
          {subtitle && (
            <p className="mb-4 text-[13px] text-(--color-uswds-base-dark)">
              {subtitle}
            </p>
          )}
          {content}
        </div>
      );
    };

    export default UswdsQuickAccess;
