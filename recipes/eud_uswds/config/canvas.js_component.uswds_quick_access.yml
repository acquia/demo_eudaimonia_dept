      title = 'Quick Access',
      subtitle = '',
      content,
      className = '',
    }) => {
      return (
        <div
          className={cn(
            'rounded-sm border-t-[6px] border-(--color-eud-gold) bg-white p-7 font-sans shadow-[0_12px_40px_rgba(0,0,0,.22)]',
            className,
