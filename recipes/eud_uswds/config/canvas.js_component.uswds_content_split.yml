js:
  original: |
    import { cn } from 'drupal-canvas';

    // USWDS Content Split
    // Two-column layout for page sections (e.g. process list + summary box,
    // featured story + collection). Ratio controls column widths.

    const ratioClass = {
      'wide-left': 'lg:grid-cols-[1.4fr_1fr]',
      even: 'lg:grid-cols-2',
      'wide-right': 'lg:grid-cols-[1fr_1.4fr]',
    };

    const UswdsContentSplit = ({
      columnRatio = 'wide-left',
      left,
      right,
      className = '',
    }) => {
      return (
        <div
          className={cn(
            'grid grid-cols-1 gap-8',
            ratioClass[columnRatio] ?? ratioClass['wide-left'],
            className,
          )}
        >
          <div>{left}</div>
          <div>{right}</div>
        </div>
      );
    };

    export default UswdsContentSplit;
