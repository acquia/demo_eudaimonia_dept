js:
  original: |
    import { cn, FormattedText } from 'drupal-canvas';

    // Section wrapper — controls background, max-width container, and optional
    // section-head (eyebrow + heading + description). Content renders in the slot.
    // navy background flips eyebrow to gold and text to white.

    const WIDTH_MAP = {
      wide: 'max-w-[1240px]',
      narrow: 'max-w-[760px]',
      full: 'max-w-none',
    };

    const PADDING_TOP_MAP = {
      none: 'pt-0',
      sm: 'pt-8',
      md: 'pt-12',
      lg: 'pt-20',
      xl: 'pt-32',
    };

    const PADDING_BOTTOM_MAP = {
      none: 'pb-0',
      sm: 'pb-8',
      md: 'pb-12',
      lg: 'pb-20',
      xl: 'pb-32',
    };

    const MARGIN_TOP_MAP = {
      none: 'mt-0',
      sm: 'mt-4',
      md: 'mt-8',
      lg: 'mt-16',
      xl: 'mt-24',
    };

    const MARGIN_BOTTOM_MAP = {
      none: 'mb-0',
      sm: 'mb-4',
      md: 'mb-8',
      lg: 'mb-16',
      xl: 'mb-24',
    };

    const BG_MAP = {
      white: 'bg-white',
      gray: 'bg-(--color-uswds-base-lightest)',
      'primary-lightest': 'bg-(--color-uswds-primary-lightest)',
      'primary-lighter': 'bg-(--color-uswds-primary-lighter)',
      primary: 'bg-(--color-uswds-primary)',
      'primary-dark': 'bg-(--color-uswds-primary-dark)',
      'primary-darker': 'bg-(--color-uswds-primary-darker)',
      'base-lightest': 'bg-(--color-uswds-base-lightest)',
      'base-lighter': 'bg-(--color-uswds-base-lighter)',
      'base-dark': 'bg-(--color-uswds-base-dark)',
      'base-darkest': 'bg-(--color-uswds-base-darkest)',
    };

    const DARK_BG = new Set(['primary', 'primary-dark', 'primary-darker', 'base-dark', 'base-darkest']);

    const UswdsSection = ({
      eyebrow = '',
      heading = '',
      description = '',
      background = 'white',
      contentWidth = 'wide',
      paddingTop = 'lg',
      paddingBottom = 'lg',
      marginTop = 'none',
      marginBottom = 'none',
      content,
      className = '',
    }) => {
      const isDark = DARK_BG.has(background);
      const maxW = WIDTH_MAP[contentWidth] ?? WIDTH_MAP.wide;

      return (
        <section
          className={cn(
            'w-full font-sans',
            BG_MAP[background] ?? BG_MAP.white,
            PADDING_TOP_MAP[paddingTop] ?? PADDING_TOP_MAP.lg,
            PADDING_BOTTOM_MAP[paddingBottom] ?? PADDING_BOTTOM_MAP.lg,
            MARGIN_TOP_MAP[marginTop] ?? MARGIN_TOP_MAP.none,
            MARGIN_BOTTOM_MAP[marginBottom] ?? MARGIN_BOTTOM_MAP.none,
            className,
          )}
        >
          <div className={cn('mx-auto px-8', maxW)}>
            {/* Section head */}
            {(eyebrow || heading || description) && (
              <div className="mb-12 max-w-3xl">
                {eyebrow && (
                  <p
                    className={cn(
                      'mb-3 text-[13px] font-bold tracking-[1.5px] uppercase',
                      isDark ? 'text-(--color-eud-gold)' : 'text-(--color-uswds-primary)',
                    )}
                  >
                    {eyebrow}
                  </p>
                )}
                {heading && (
                  <h2
                    className={cn(
                      'mb-3 font-serif text-[36px] leading-tight font-bold',
                      isDark ? 'text-white' : 'text-(--color-uswds-primary-darker)',
                    )}
                  >
                    {heading}
                  </h2>
                )}
                {description && (
                  <FormattedText
                    className={cn(
                      'text-[18px] leading-relaxed',
                      isDark ? 'text-white/75' : 'text-(--color-uswds-base-dark)',
                    )}
                  >
                    {description}
                  </FormattedText>
                )}
              </div>
            )}

            {/* Content slot */}
            {content && <div>{content}</div>}
          </div>
        </section>
      );
    };

    export default UswdsSection;
