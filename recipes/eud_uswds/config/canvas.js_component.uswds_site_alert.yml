name: '(Eud-Kit) USWDS Site Alert'
required: {  }
props:
  variant:
    type: string
    enum:
      - info
      - emergency
      - warning
    'meta:enum':
      info: Info
      emergency: Emergency
      warning: Warning
    title: Variant
    examples:
      - info
  heading:
    type: string
    title: Heading
    examples:
      - 'Short alert message'
  body:
    type: string
    contentMediaType: text/html
    x-formatting-context: block
    title: Body
    examples:
      - 'Optional site-wide alert body text.'
  slim:
    type: boolean
    title: Slim
    examples:
      - false
  width:
    type: string
    enum:
      - full
      - boxed
    'meta:enum':
      full: 'Full width'
      boxed: 'Boxed (max 1240px)'
    title: Width
    examples:
      - full
