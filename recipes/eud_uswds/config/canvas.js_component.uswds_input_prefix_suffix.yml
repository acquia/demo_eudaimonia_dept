js:
  original: |
    import UswdsLabel from '@/components/uswds_label';
    import { cn } from 'drupal-canvas';

    const UswdsInputPrefixSuffix = ({
      label = '',
      name = '',
      prefixText = '',
      suffixText = '',
      prefixIcon,
      suffixIcon,
      placeholder = '',
      hintText = '',
      state = 'default',
      errorText = '',
      className = '',
    }) => {
      const id = `input-ps-${name}`;
      const isError = state === 'error';

      return (
        <div
          className={cn(
            'usa-form-group flex flex-col gap-(--spacing-uswds-1) font-sans',
            className,
          )}
        >
          {label && (
            <UswdsLabel
              labelText={label}
              htmlFor={id}
              hintText={hintText}
              state={state}
              errorText={errorText}
            />
          )}
          <div
            className={cn(
              'usa-input-group flex h-10 border border-(--color-uswds-base-ink) bg-white focus-within:outline focus-within:outline-[length:4px] focus-within:outline-offset-0 focus-within:outline-(--uswds-focus-color)',
              isError && 'border-(--color-uswds-error-dark)',
            )}
          >
            {(prefixText || prefixIcon) && (
              <span className="usa-input-prefix flex shrink-0 items-center justify-center px-2 text-[length:--font-size-uswds-sm] text-(--color-uswds-base)">
                {prefixIcon ? (
                  <span
                    aria-hidden="true"
                    className="flex size-6 items-center justify-center"
                  >
                    {prefixIcon}
                  </span>
                ) : (
                  prefixText
                )}
              </span>
            )}
            <input
              id={id}
              type="text"
              name={name}
              placeholder={placeholder}
              aria-invalid={isError ? 'true' : undefined}
              className="usa-input min-w-0 flex-1 bg-transparent px-2 py-2 text-[length:--font-size-uswds-sm] text-(--color-uswds-base-ink) focus:outline-none"
            />
            {(suffixText || suffixIcon) && (
              <span className="usa-input-suffix flex shrink-0 items-center justify-center px-2 text-[length:--font-size-uswds-sm] text-(--color-uswds-base)">
                {suffixIcon ? (
                  <span
                    aria-hidden="true"
                    className="flex size-6 items-center justify-center"
                  >
                    {suffixIcon}
                  </span>
                ) : (
                  suffixText
                )}
              </span>
            )}
          </div>
        </div>
      );
    };

    export default UswdsInputPrefixSuffix;
