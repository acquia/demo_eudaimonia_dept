js:
  original: |
    import { cva } from 'class-variance-authority';
    import { cn } from 'drupal-canvas';

    const dividerVariants = cva('usa-divider w-full border-0 border-t', {
      variants: {
        color: {
          default: 'border-(--color-uswds-base-lighter)',
          strong: 'border-(--color-uswds-base-light)',
          muted: 'border-(--color-uswds-base-lightest)',
          primary: 'border-(--color-uswds-primary)',
          'accent-cool': 'border-(--color-uswds-accent-cool)',
          'accent-warm': 'border-(--color-uswds-accent-warm)',
          inverse: 'border-white/30',
        },
        thickness: {
          thin: 'border-t',
          medium: 'border-t-2',
          thick: 'border-t-4',
        },
        verticalSpacing: {
          none: 'my-0',
          sm: 'my-4',
          md: 'my-8',
          lg: 'my-12',
          xl: 'my-16',
        },
      },
      defaultVariants: {
        color: 'default',
        thickness: 'thin',
        verticalSpacing: 'md',
      },
    });

    const UswdsDivider = ({
      color = 'default',
      thickness = 'thin',
      verticalSpacing = 'md',
      className = '',
    }) => (
      <hr className={cn(dividerVariants({ color, thickness, verticalSpacing }), className)} />
    );

    export default UswdsDivider;
