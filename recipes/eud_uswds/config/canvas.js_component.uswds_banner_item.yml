js:
  original: |
    import { cn, FormattedText, Image } from 'drupal-canvas';

    const UswdsBannerItem = ({
      heading = '',
      body = '',
      background = 'light', // injected by uswds_banner via cloneElement
      icon,
    }) => {
      const isDark = background === 'dark';

      return (
        <div className="flex gap-2">
          {icon?.src && (
            <div className="h-10 w-10 shrink-0">
              <Image
                src={icon.src}
                alt={icon.alt || ''}
                width={icon.width || 40}
                height={icon.height || 40}
                className="h-full w-full object-contain"
              />
            </div>
          )}
          <div
            className={cn(
              'flex flex-col gap-1',
              isDark ? 'text-white' : 'text-(--color-uswds-base-ink)',
            )}
          >
            {heading && (
              <p className="m-0 text-sm leading-snug font-bold">{heading}</p>
            )}
            {body && (
              <FormattedText className="m-0 text-sm leading-relaxed">
                {body}
              </FormattedText>
            )}
          </div>
        </div>
      );
    };

    export default UswdsBannerItem;
