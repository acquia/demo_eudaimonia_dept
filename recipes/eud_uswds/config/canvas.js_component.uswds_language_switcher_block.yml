                ref={dropdownRef}
                role="listbox"
                aria-label="Select language"
                onClick={() => setOpen(false)}
                style={{
                  position: 'fixed',
                  top: pos.top - window.scrollY,
                  left: pos.left,
                  width: pos.width,
                  zIndex: 9999,
                }}
                className={cn(
                  'overflow-hidden bg-(--color-uswds-primary-darker)',
                  'shadow-[0_4px_12px_rgba(0,0,0,.2)]',
                  '[&_ul]:m-0 [&_ul]:list-none [&_ul]:p-0',
                  '[&_li]:border-t [&_li]:border-white/10 [&_li:first-child]:border-t-0',
                  // Links and the current-language span share the same layout so
                  // every item lines up (the current item renders as a <span>).
                  '[&_a]:block [&_a]:px-(--spacing-uswds-205) [&_a]:py-3 [&_a]:text-sm [&_a]:text-white [&_a]:no-underline',
                  '[&_span]:block [&_span]:px-(--spacing-uswds-205) [&_span]:py-3 [&_span]:text-sm [&_span]:text-white',
                  '[&_a:hover]:bg-white/10 [&_a:active]:bg-white/25',
                  // Current language is emitted as [aria-current], not li.is-active.
                  '[&_[aria-current]]:bg-white/15 [&_[aria-current]]:font-bold',
                  // Availability note ("Not available in your language…").
                  '[&_p]:m-0 [&_p]:px-(--spacing-uswds-205) [&_p]:py-2 [&_p]:text-xs [&_p]:text-white/70',
                )}
              >
                {languageSwitcherBlock}
              </div>,
              document.body,
            )}
        </nav>
      );
    };

    export default UswdsLanguageSwitcherBlock;
