js:
  original: |
    import { cn } from 'drupal-canvas';

    /**
     * UswdsProcessListItem renders a single step in a process list.
     *
     * Props:
     *  - heading:  Step heading text
     *  - body:     Step body / description text
     *  - last:     Set true on the final step to hide the connector rail
     *  - number:   Step number (auto-numbered via CSS counters in most cases;
     *              passed explicitly when used standalone)
     */
    const UswdsProcessListItem = ({
      heading = '',
      body = '',
      last = false,
      number = '',
      className = '',
    }) => {
      return (
        <li
          className={cn(
            'usa-process-list__item relative flex items-start gap-4 pb-8 font-sans',
            className,
          )}
        >
          {/* Connector rail — hidden on last item */}
          {!last && (
            <span
              aria-hidden="true"
              className="absolute top-10 bottom-0 left-5 w-2 -translate-x-1/2 bg-(--color-uswds-primary-lighter)"
            />
          )}

          {/* Step counter circle */}
          <span
            aria-hidden="true"
            className="relative z-10 flex h-10 w-10 shrink-0 items-center justify-center rounded-full border-2 border-(--color-uswds-base-ink) bg-white font-serif text-[length:var(--font-size-uswds-lg,1.375rem)] leading-none font-bold text-(--color-uswds-base-ink)"
          >
            {number}
          </span>

          {/* Step content */}
          <div className="flex flex-col gap-1 pt-2">
            {heading && (
              <h3 className="usa-process-list__heading m-0 font-serif text-[length:var(--font-size-uswds-lg,1.375rem)] leading-[1.3] font-bold text-(--color-uswds-primary-darker)">
                {heading}
              </h3>
            )}
            {body && (
              <p className="m-0 text-base leading-relaxed text-(--color-uswds-base-ink)">
                {body}
              </p>
            )}
          </div>
        </li>
      );
    };

    export default UswdsProcessListItem;
