js:
  original: |
    import { cn } from 'drupal-canvas';

    // USWDS Person Card — leadership card with initials avatar, role, name, title, bio.

    const UswdsPersonCard = ({
      initials = '',
      roleLabel = '',
      name = '',
      title = '',
      bio = '',
      className = '',
    }) => {
      return (
        <div
          className={cn(
            'usa-card flex flex-col gap-4 rounded-sm border border-(--color-uswds-base-lighter) p-6 font-sans',
            className,
          )}
        >
          <div className="flex items-start gap-4">
            {/* Avatar */}
            <div
              className="flex h-[68px] w-[68px] shrink-0 items-center justify-center rounded-full bg-(--color-uswds-primary-lightest) text-xl font-bold text-(--color-uswds-primary-darker)"
              aria-hidden="true"
            >
              {initials}
            </div>
            {/* Role + name + title */}
            <div>
              {roleLabel && (
                <p className="mb-1 text-xs font-bold tracking-wider text-(--color-uswds-primary) uppercase">
                  {roleLabel}
                </p>
              )}
              {name && (
                <h3 className="font-serif text-2xl leading-tight font-bold text-(--color-uswds-primary-darker)">
                  {name}
                </h3>
              )}
              {title && (
                <p className="mt-0.5 text-sm text-(--color-uswds-base-dark) italic">
                  {title}
                </p>
              )}
            </div>
          </div>
          {bio && (
            <p className="text-sm leading-relaxed text-(--color-uswds-base-ink)">
              {bio}
            </p>
          )}
        </div>
      );
    };

    export default UswdsPersonCard;
