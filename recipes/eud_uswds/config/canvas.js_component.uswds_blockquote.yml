js:
  original: |
    import { cva } from 'class-variance-authority';
    import { cn, FormattedText } from 'drupal-canvas';

    // USWDS Blockquote
    // Pull quote / testimonial component with a left accent bar.
    // variant controls the bar color; textColor flips content for dark backgrounds.
    // Figma equivalent: Testimonial / Pull Quote pattern.
    // Accent bar colors match existing USWDS token palette.

    const barVariants = cva('w-1 shrink-0 self-stretch rounded-full', {
      variants: {
        variant: {
          default: 'bg-(--color-uswds-primary)',
          'accent-cool': 'bg-(--color-uswds-accent-cool)',
          'accent-warm': 'bg-(--color-uswds-accent-warm)',
          success: 'bg-(--color-uswds-success)',
          base: 'bg-(--color-uswds-base-light)',
        },
      },
      defaultVariants: { variant: 'default' },
    });

    const UswdsBlockquote = ({
      quoteText = '',
      name = '',
      roleAttribution = '',
      accentBarColor = 'default',
      textColor = 'dark',
      className = '',
    }) => {
      if (!quoteText) return null;
      const isLight = textColor === 'light';

      return (
        <figure
          className={cn('usa-blockquote m-0 flex gap-5 py-2 font-sans', className)}
        >
          {/* Accent bar */}
          <div className={barVariants({ variant: accentBarColor })} aria-hidden="true" />

          {/* Content */}
          <div className="flex flex-col gap-3">
            <blockquote className="m-0 p-0">
              <FormattedText
                className={cn(
                  'text-xl leading-relaxed font-medium italic',
                  isLight ? 'text-white' : 'text-(--color-uswds-base-ink)',
                )}
              >
                {quoteText}
              </FormattedText>
            </blockquote>

            {(name || roleAttribution) && (
              <figcaption className="flex flex-col gap-0.5">
                {name && (
                  <span
                    className={cn(
                      'text-base font-bold not-italic',
                      isLight ? 'text-white' : 'text-(--color-uswds-base-ink)',
                    )}
                  >
                    — {name}
                  </span>
                )}
                {roleAttribution && (
                  <span
                    className={cn(
                      'text-sm not-italic',
                      isLight
                        ? 'text-white/70'
                        : 'text-(--color-uswds-base-dark)',
                    )}
                  >
                    {roleAttribution}
                  </span>
                )}
              </figcaption>
            )}
          </div>
        </figure>
      );
    };

    export default UswdsBlockquote;
