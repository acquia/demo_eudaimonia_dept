js:
  original: |
    import { cn } from 'drupal-canvas';

    const UswdsBreadcrumbItem = ({
      text = '',
      href = '/',
      context = 'on-light',
      isLast = false,
      showSeparator = false,
    }) => {
      const isDark = context === 'on-dark';

      const separator = showSeparator ? (
        <span
          className={isDark ? 'text-white/70' : 'text-(--color-uswds-base)'}
          aria-hidden="true"
        >
          /
        </span>
      ) : null;

      if (isLast) {
        return (
          <>
            {separator}
            <span
              className={cn('usa-breadcrumb__text', isDark ? 'text-white' : 'text-(--color-uswds-base-ink)')}
              aria-current="page"
            >
              {text}
            </span>
          </>
        );
      }

      return (
        <>
          {separator}
          <a
            href={href}
            className={cn(
              'usa-breadcrumb__link underline focus-visible:outline-2 focus-visible:outline-offset-(--uswds-focus-offset) focus-visible:outline-(--uswds-focus-color)',
              isDark
                ? 'text-white/70 no-underline hover:text-white hover:underline'
                : 'text-(--color-uswds-primary) hover:text-(--color-uswds-primary-dark)',
            )}
          >
            {text}
          </a>
        </>
      );
    };

    export default UswdsBreadcrumbItem;
