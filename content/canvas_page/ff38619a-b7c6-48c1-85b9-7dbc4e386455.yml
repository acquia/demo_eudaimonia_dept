      component_id: js.uswds_accordion_item
      inputs:
        body: 'Established in 2026, the Department of Eudaimonia coordinates programs that support human flourishing. We don’t replace existing services — we make them easier to find, simpler to apply for, and better connected to one another.'
        heading: 'What is the Department of Eudaimonia, and how is it different from existing agencies?'
        variant: dark
        expanded: true
    -
      parent_uuid: 09538fae-29be-4766-bd4b-f92b0e79dc38
      slot: items
      uuid: 7283c901-e1b9-4826-a6f1-f868c22e0a6f
      component_id: js.uswds_accordion_item
      inputs:
        body: 'Many programs are available to permanent residents and qualified non-residents. Specific eligibility rules vary by program — use the eligibility checker on each program page or speak with a representative at your local service center.'
        heading: 'Am I eligible for benefits if I have non-resident status?'
        variant: dark
        expanded: false
    -
      parent_uuid: 09538fae-29be-4766-bd4b-f92b0e79dc38
      slot: items
      uuid: cd054164-418e-4512-988c-823bc9ce6827
      component_id: js.uswds_accordion_item
      inputs:
        body: 'Most decisions are made within 14 business days. Complex cases may take up to 45 days. You can track your application status in your Eudaimonia account at any time.'
        heading: 'How long does it take to receive a decision?'
        variant: dark
        expanded: false
    -
      parent_uuid: 09538fae-29be-4766-bd4b-f92b0e79dc38
      slot: items
      uuid: f311c36f-7bd4-466b-ad9a-a7d0f2f3abac
      component_id: js.uswds_accordion_item
      inputs:
        body: 'Most direct benefits are not taxable. The Lifelong Learning Account match and Career Re-entry Grants are tax-exempt. Refer to your Form EUD-1099 each January or speak with a tax professional.'
        heading: 'Are benefits considered taxable income?'
        variant: dark
        expanded: false
    -
      parent_uuid: 09538fae-29be-4766-bd4b-f92b0e79dc38
      slot: items
      uuid: 1ba73049-eef6-4190-a056-ad4cccf345c7
      component_id: js.uswds_accordion_item
      inputs:
        body: 'You have the right to appeal any decision within 60 days. Appeals are heard by an independent administrative judge. Free legal assistance is available at every service center.'
        heading: 'What if I disagree with a decision about my application?'
