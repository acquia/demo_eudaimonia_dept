      component_id: js.uswds_alert
      inputs:
        body:
          value: '<p>The Flourish Family Benefit enrollment window closes December 31, 2026. <a href="/apply">Learn more about eligibility</a>.</p>'
          format: canvas_html_block
        slim: false
        noIcon: false
        heading: 'Open enrollment period active'
        variant: info
    -
      uuid: e94bc396-9c81-48af-963b-f40961b43c41
      component_id: js.uswds_section
      inputs:
        eyebrow: 'Our Purpose'
        heading: 'Mission & Vision'
        marginTop: none
        background: white
        paddingTop: sm
        description: '<p>The Department of Eudaimonia exists to ensure that every American has access to the conditions that make a meaningful, healthy, and self-directed life possible — regardless of where they were born, how much they earn, or what challenges they face.</p><p>We work to reduce friction, eliminate duplication, and connect people with the right support at the right time. Where programs existed, we made them work better together. Where gaps existed, we built something new.</p>'
        contentWidth: wide
        marginBottom: none
        paddingBottom: sm
    -
      parent_uuid: e94bc396-9c81-48af-963b-f40961b43c41
      slot: content
      uuid: 18ded744-b943-4c7d-8a80-21f77191094b
      component_id: js.uswds_icon_list
      inputs: {  }
    -
      parent_uuid: 18ded744-b943-4c7d-8a80-21f77191094b
      slot: items
      uuid: 86a0e486-2bb2-41a6-8707-c6eed135886d
      component_id: js.uswds_icon_list_item
      inputs:
        body: 'Programs are built around how people actually live — not how agencies are organized.'
        heading: 'Human-centered design'
    -
      parent_uuid: 18ded744-b943-4c7d-8a80-21f77191094b
      slot: items
      uuid: 4f84acd2-502e-40b1-8580-03d548e2ca44
      component_id: js.uswds_icon_list_item
      inputs:
        body: 'Every program is evaluated against clear outcomes. Results are published annually.'
        heading: 'Evidence and accountability'
    -
      parent_uuid: 18ded744-b943-4c7d-8a80-21f77191094b
      slot: items
      uuid: a5dc32ed-8f1c-4b04-a011-a45cb5d7333c
      component_id: js.uswds_icon_list_item
      inputs:
        body: 'We prioritize communities that have historically been underserved by federal programs.'
        heading: 'Equity and access'
    -
      parent_uuid: 18ded744-b943-4c7d-8a80-21f77191094b
      slot: items
      uuid: bec55efa-e895-4bf9-be77-6b316e8d8984
      component_id: js.uswds_icon_list_item
      inputs:
        body: 'A benefit that’s hard to use isn’t really a benefit. We design for the person, not the expert.'
        heading: Simplicity
    -
      uuid: cca73df3-1a30-4b6e-8c9b-0e39468852a8
      component_id: js.uswds_section
      inputs:
        eyebrow: 'Our Story'
        heading: 'How We Were Formed'
        marginTop: none
        paddingTop: sm
        description: 'The Department of Eudaimonia emerged from a decade of research showing that fragmented federal programs were failing the people they were meant to serve — not from lack of resources, but from lack of coordination.'
        contentWidth: wide
        marginBottom: none
        paddingBottom: sm
    -
      parent_uuid: cca73df3-1a30-4b6e-8c9b-0e39468852a8
      slot: content
      uuid: 1e26072c-c692-43a9-b5fa-807cb79035cc
      component_id: js.uswds_process_list
      inputs: {  }
    -
      parent_uuid: 1e26072c-c692-43a9-b5fa-807cb79035cc
      slot: items
      uuid: 54a20d55-68f3-46d9-acb6-cf26ead41d9f
      component_id: js.uswds_process_list_item
      inputs:
        body: 'A bipartisan commission examined federal wellbeing programs across 14 agencies. Their report found that the average American qualified for 7.3 programs but accessed fewer than 2, primarily due to application complexity and lack of awareness.'
        last: false
        number: '1'
        heading: 'The Flourishing Commission (2022–2023)'
    -
      parent_uuid: 1e26072c-c692-43a9-b5fa-807cb79035cc
      slot: items
      uuid: 66b4cfd3-58fd-4b95-accc-0cc0d0307006
      component_id: js.uswds_process_list_item
      inputs:
        body: 'The President directed OMB to develop a consolidation plan. Over 18 months, 47 existing programs were reviewed, simplified, and in some cases merged into the six pillars of the Eudaimonia framework.'
        last: false
        number: '2'
        heading: 'Executive Order 14211 (January 2024)'
    -
      parent_uuid: 1e26072c-c692-43a9-b5fa-807cb79035cc
      slot: items
      uuid: e436916f-6864-4b56-bfd0-67d6323acfbe
      component_id: js.uswds_process_list_item
      inputs:
        body: 'The Flourishing for All Act created the Department with Cabinet-level status. Secretary Maya Hawthorne was confirmed unanimously as the first Secretary of Eudaimonia.'
        last: false
        number: '3'
        heading: 'Department established (March 2025)'
    -
      parent_uuid: 1e26072c-c692-43a9-b5fa-807cb79035cc
      slot: items
      uuid: a5c3f738-5131-4f15-8894-80b4334cd663
      component_id: js.uswds_process_list_item
      inputs:
        body: 'The Flourish Family Benefit and Lifelong Learning Account went live simultaneously, serving 4.2 million Americans in the first 90 days — exceeding first-year projections by 340%.'
        last: true
        number: '4'
        heading: 'First programs launch (October 2025)'
    -
