      component_id: js.uswds_person_card
      inputs:
        bio: 'Former director of the Harvard Kennedy School’s Center for Human Flourishing. Confirmed unanimously by the Senate in March 2025.'
        name: 'Maya Hawthorne'
        title: 'Secretary of Eudaimonia'
        initials: MH
        roleLabel: Secretary
    -
      parent_uuid: fcf949f5-15f0-46e4-8cf5-995b067405e9
      slot: items
      uuid: f2f8b824-b893-4b91-87c2-3b424ec92a97
      component_id: js.uswds_person_card
      inputs:
        bio: 'Previously led the Office of Family Assistance at HHS. Architect of the single-application model that underpins all Eudaimonia programs.'
        name: 'David Reyes'
        title: 'Deputy Secretary of Eudaimonia'
        initials: DR
        roleLabel: 'Deputy Secretary'
    -
      parent_uuid: fcf949f5-15f0-46e4-8cf5-995b067405e9
      slot: items
      uuid: 3a9b92e1-4403-48b5-87ab-1578644f031b
      component_id: js.uswds_person_card
      inputs:
        bio: 'Oversees the six program pillars and coordinates with state and local partners. Former executive director of the National Academy for Social Insurance.'
        name: 'Jennifer Kwan'
        title: 'Chief Program Officer'
        initials: JK
        roleLabel: 'Chief Program Officer'
    -
      parent_uuid: fcf949f5-15f0-46e4-8cf5-995b067405e9
      slot: items
      uuid: d1aef9e1-ee8c-4e12-bf0c-6c829081426d
      component_id: js.uswds_person_card
      inputs:
        bio: 'Built the MyEudaimonia portal and the unified eligibility engine. Previously at 18F and USDS, where he led the HealthCare.gov recovery effort.'
        name: 'Thomas Abara'
        title: 'Chief Technology Officer'
        initials: TA
        roleLabel: 'Chief Technology Officer'
    -
