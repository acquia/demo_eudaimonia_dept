      uuid: 671eaeab-aacc-4fc3-8b37-703499dbd85a
      component_id: js.uswds_summary_box
      inputs:
        body:
          value: '<ul><li>96% customer satisfaction rating across all programs</li><li>Average application time reduced from 4.5 hours to 18 minutes</li><li>78% of eligible households now access at least one program — up from 27%</li><li>$2.4B in administrative savings through program consolidation</li><li>National Wellbeing Index rose 4.2 points in the first year</li></ul>'
          format: canvas_html_block
        heading: 'FY25 Annual Report Highlights'
    -
      uuid: b624373c-fa51-4c4f-baf8-335a1c277994
      component_id: js.uswds_section
      inputs:
        eyebrow: Questions
        heading: 'Common Questions About the Department'
        marginTop: none
        background: white
        paddingTop: sm
        contentWidth: wide
        marginBottom: none
        paddingBottom: sm
    -
      parent_uuid: b624373c-fa51-4c4f-baf8-335a1c277994
      slot: content
      uuid: 56725641-1676-4b6e-a7d5-3d6d638c373c
      component_id: js.uswds_accordion
      inputs:
        variant: default
        bordered: true
        multiselectable: false
    -
      parent_uuid: 56725641-1676-4b6e-a7d5-3d6d638c373c
      slot: items
      uuid: b0b7bff1-5b6c-4d99-b2a9-b6aa219bd89e
      component_id: js.uswds_accordion_item
      inputs:
        body: 'No. Eudaimonia coordinates and connects programs — it doesn’t replace agencies like HHS, HUD, or the Department of Labor. Staff from those agencies are detailed to Eudaimonia to help integrate services, but the underlying programs remain within their original departments.'
        heading: 'Is Eudaimonia replacing other agencies?'
        variant: default
        expanded: true
    -
      parent_uuid: 56725641-1676-4b6e-a7d5-3d6d638c373c
      slot: items
      uuid: 223cb5df-9eb5-45f1-b519-f536ae5c979a
      component_id: js.uswds_accordion_item
      inputs:
        body: 'Eudaimonia is funded through public partnerships. The FY26 budget is $184.3 billion, the majority of which flows directly to program beneficiaries. Administrative costs are capped at 1.8% of total expenditure by statute.'
        heading: 'How is the Department funded?'
        variant: default
        expanded: false
    -
      parent_uuid: 56725641-1676-4b6e-a7d5-3d6d638c373c
      slot: items
      uuid: 6d187941-be85-42ed-b4c6-5922e3745801
      component_id: js.uswds_accordion_item
      inputs:
        body: 'The Department’s headquarters is in Washington, D.C. There are 3,900 local service centers across all 50 states, the District of Columbia, Puerto Rico, Guam, and the U.S. Virgin Islands.'
        heading: 'Where are Eudaimonia offices located?'
        variant: default
        expanded: false
    -
      parent_uuid: 56725641-1676-4b6e-a7d5-3d6d638c373c
      slot: items
      uuid: f7ddb271-5cba-47f9-ae0b-aed48a161cf8
      component_id: js.uswds_accordion_item
      inputs:
        body: 'Contact the Office of the Inspector General at oig.eudaimonia.gov or call the OIG hotline at 1-800-EUD-TIPS. Reports can be made anonymously.'
        heading: 'How do I report waste, fraud, or abuse?'
        variant: default
        expanded: false
