name: 'Department of Eudaimonia'
type: Site
description: 'Site template for a U.S. government department, featuring a library of USWDS (U.S. Web Design System) Canvas JS code components, article/program/person content types, media, and editorial workflow.'
recipes:
  - core/recipes/administrator_role
install:
  # Core + contrib modules.
  - block
  - canvas
  - canvas_oauth
  - ckeditor5
  - config
  - consumers
  - content_moderation
  - dblog
  - diff
  - dynamic_page_cache
  - entity_clone
  - field_group
  - field_ui
  - file
  - filter
  - focal_point
  - gin_login
  - jsonapi
  - jsonapi_extras
  - jsonapi_menu_items
  - jsonapi_query_builder
  - language
  - linkit
  - media
  - media_library
  - menu_link_content
  - menu_ui
  - metatag
  - navigation
  - navigation_extra_tools
  - node
  - options
  - page_cache
  - pathauto
  - redirect
  - scheduler
  - scheduler_content_moderation_integration
  - simple_sitemap
  - tagify
  - taxonomy
  - text
  - token
  - views
  - views_ui
  - workflows
  # Themes.
  - claro
  - canvas_stark
  - gin
config:
  strict: false
  import:
    canvas:
      - editor.editor.canvas_html_block
      - editor.editor.canvas_html_inline
      - filter.format.canvas_html_block
      - filter.format.canvas_html_inline
      - views.view.canvas_pages
    claro:
      - block.block.claro_breadcrumbs
      - block.block.claro_content
      - block.block.claro_local_actions
      - block.block.claro_messages
      - block.block.claro_page_title
      - block.block.claro_primary_local_tasks
      - block.block.claro_secondary_local_tasks
    content_moderation:
      - views.view.moderated_content
    dblog:
      - views.view.watchdog
    file:
      - views.view.files
    gin:
      - block.block.gin_breadcrumbs
      - block.block.gin_content
      - block.block.gin_local_actions
      - block.block.gin_messages
      - block.block.gin_page_title
      - block.block.gin_primary_local_tasks
      - block.block.gin_secondary_local_tasks
    language:
      - language.entity.und
      - language.entity.zxx
      - language.entity.en
    media:
      - core.entity_view_mode.media.full
      - system.action.media_delete_action
      - system.action.media_publish_action
      - system.action.media_save_action
      - system.action.media_unpublish_action
      - views.view.media
    media_library:
      - core.entity_form_mode.media.media_library
      - core.entity_view_mode.media.media_library
      - image.style.media_library
      - media_library.settings
      - views.view.media_library
    navigation:
      - navigation.block_layout
      - navigation.settings
      - system.menu.content
      - system.menu.navigation-user-links
    node:
      - core.entity_view_mode.node.full
      - system.action.node_delete_action
      - system.action.node_publish_action
      - system.action.node_save_action
      - system.action.node_unpublish_action
      - views.view.content
    pathauto:
      - system.action.pathauto_update_alias_node
      - system.action.pathauto_update_alias_user
    redirect:
      - redirect.settings
      - system.action.redirect_delete_action
      - views.view.redirect
    taxonomy:
      - system.action.taxonomy_term_publish_action
      - system.action.taxonomy_term_unpublish_action
      - taxonomy.settings
      - views.view.taxonomy_term
    user:
      - system.action.user_block_user_action
      - system.action.user_cancel_user_action
      - system.action.user_unblock_user_action
      - views.view.user_admin_people
  actions:
    file.settings:
      simple_config_update:
        filename_sanitization:
          transliterate: true
          replace_whitespace: true
          replace_non_alphanumeric: true
          deduplicate_separators: true
          lowercase: true
          replacement_character: '-'
    system.site:
      simple_config_update:
        name: 'Department of Eudaimonia'
        mail: 'no-reply@example.com'
        page:
          front: '/eud-home'
    system.theme:
      simple_config_update:
        admin: gin
        default: canvas_stark
    # Disable the install profile's default "Home" link (e.g. the Standard
    # profile's `standard.front_page`) so it does not duplicate the recipe's own
    # Home menu link. Harmless on profiles that do not define it.
    core.menu.static_menu_link_overrides:
      simpleConfigUpdate:
        definitions:
          standard__front_page:
            enabled: false
            menu_name: main
            parent: ''
            weight: 0
            expanded: false
extra:
  drupal_cms_installer:
    finish_url: '/'
    creator: 'Acquia Demo Team'
