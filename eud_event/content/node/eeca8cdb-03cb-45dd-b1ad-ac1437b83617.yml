  body:
    -
      value: 'Open enrollment for the Flourish Family Benefit closes on May 31, 2026. This workshop is designed for anyone who has not applied before, or who applied last year and has had a change in household, income, or caregiving situation. A program officer walks through the full application on screen, section by section, pausing at the places where applicants most often get stuck.'
      format: filtered_html
      summary: ''
  field_categories:
    -
      entity: 2ba6c29f-823a-4509-9e9b-be3a922e9903
  field_event_accessibility:
    -
      value: 'Live CART captioning and ASL interpretation are provided. For materials in an alternate format, or any other accommodation, submit a request by May 7 so we can arrange it in time.'
      format: filtered_html
  field_event_agenda:
    -
      value: '<ul><li><strong>2:00 pm — Welcome and overview.</strong> What the Flourish Family Benefit covers and who it is for.</li><li><strong>2:10 pm — Eligibility walkthrough.</strong> Income limits, household composition, and the regional adjustment, with worked examples.</li><li><strong>2:35 pm — Live application demo.</strong> Screen-share of the full application, including the caregiver attestation.</li><li><strong>3:00 pm — Open Q&A.</strong> Program officers answer questions submitted in chat. No question is too basic.</li><li><strong>3:25 pm — Where to get help.</strong> Service centers, phone support, and free in-person assistance near you.</li></ul>'
      format: filtered_html
  field_event_contact:
    -
      value: 'events@dept.eud.ai or 1-800-EUD-INFO, weekdays 7 am – 9 pm ET'
  field_event_cost:
    -
      value: Free
  field_event_end:
    -
      value: '2026-05-14T15:30:00'
  field_event_format:
    -
      value: online
  field_event_host:
    -
      value: 'Office of Public Engagement'
  field_event_language:
    -
      value: 'English, with live Spanish interpretation'
  field_event_learn:
    -
      value: '<ul><li>Whether your household qualifies, and how the income limit is adjusted for your region</li><li>Which documents to gather before you start, and which ones we verify automatically</li><li>How to complete Form EUD-217 if you are a caregiver for an older relative</li><li>What happens after you submit — timelines, notices, and how to track your application</li><li>How to appeal a decision, and where to get free legal help</li></ul>'
      format: filtered_html
  field_event_location:
