    -
      value: 'A step-by-step walkthrough of the 2026 application, followed by a live Q&A with program officers. No prior knowledge needed.'
  field_event_who:
    -
      value: 'Parents and kinship caregivers, adults caring for older relatives, and anyone who was found ineligible in a previous year. Caseworkers, librarians, and community organizations who help others apply are also welcome — the session is open to the public.'
