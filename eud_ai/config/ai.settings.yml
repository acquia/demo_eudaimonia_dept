prompt_logging: false
prompt_logging_tags: ''
default_providers:
  # Chat runs on Anthropic via the Acquia AI gateway. Embeddings, moderation,
  # speech and image generation stay on OpenAI, which is still installed -
  # Anthropic has no equivalent for them.
  chat:
    provider_id: anthropic
    model_id: claude-sonnet-4-5
  chat_with_complex_json:
    provider_id: anthropic
    model_id: claude-sonnet-4-5
  chat_with_image_vision:
    provider_id: anthropic
    model_id: claude-sonnet-4-5
  chat_with_structured_response:
    provider_id: anthropic
    model_id: claude-sonnet-4-5
  chat_with_tools:
    provider_id: anthropic
    model_id: claude-sonnet-4-5
  embeddings:
    provider_id: openai
    model_id: text-embedding-3-small
  moderation:
    provider_id: openai
    model_id: omni-moderation-latest
  speech_to_text:
    provider_id: openai
    model_id: whisper-1
  text_to_image:
    provider_id: openai
    model_id: dall-e-3
  text_to_speech:
    provider_id: openai
    model_id: tts-1-hd
default_vdb_provider: ''
